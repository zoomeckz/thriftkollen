<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161A20">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thriftkollen">
<title>Thriftkollen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thriftkollen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: mobile-first app. Sticky snabbkoll-bar högst upp, flikar under, kortrutnät som blir en kolumn på mobil.
   Prislappen (gul, med hål) är signaturdetaljen: det är maxpriset du får betala i butiken. */
/* Alltid mörkt tema, oavsett telefonens inställning. */
:root {
  --bg: #0E1115; --surface: #161A20; --surface-2: #1E242C; --ink: #E8ECF1; --muted: #98A2AF; --line: #2A313B;
  --accent: #7EA0FF; --accent-ink: #0B1020; --tag: #F2C52E; --tag-ink: #221A00;
  --good: #4CC583; --good-bg: #12301F; --warn: #E6B055; --warn-bg: #33270F; --bad: #F2766E; --bad-bg: #3A1816;
  --tradera: #F2C52E; --blocket: #7EA0FF;
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }

/* Toppmenyn: en smal list som alltid syns. Menyn fälls ut över innehållet i stället för att trycka ner det. */
header.top { position: fixed; top: 0; left: 0; right: 0; z-index: 15; padding-top: env(safe-area-inset-top, 0px); background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar { display: flex; align-items: center; gap: 10px; height: 56px; }
.logo { margin: 0; flex: 0 0 auto; font-family: var(--font-display); font-weight: 800; font-stretch: 80%; font-size: 1.35rem; letter-spacing: -0.01em; text-transform: uppercase; line-height: 1; }
.logo span { background: var(--tag); color: var(--tag-ink); padding: 0 .25em; margin-left: .08em; }
.bar-info { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px; overflow: hidden; background: none; border: 0; padding: 6px 0; cursor: pointer; text-align: left; font-weight: 600; color: var(--muted); white-space: nowrap; }
.bar-info #tabName { overflow: hidden; text-overflow: ellipsis; }
.price-chip { background: var(--tag); color: var(--tag-ink); }
.menu-btn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; cursor: pointer; }
.burger { display: grid; gap: 3px; width: 16px; }
.burger i { display: block; height: 2px; border-radius: 2px; background: currentColor; transition: transform .2s, opacity .2s; }
.menu-btn[aria-expanded="true"] .burger i:nth-child(1) { transform: translateY(5px) rotate(45deg); }
.menu-btn[aria-expanded="true"] .burger i:nth-child(2) { opacity: 0; }
.menu-btn[aria-expanded="true"] .burger i:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }
.drawer { position: absolute; left: 0; right: 0; top: 100%; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: 0 18px 40px rgb(0 0 0 / .28); max-height: calc(100vh - 80px); overflow-y: auto; }
.drawer-in { display: grid; gap: 14px; padding-block: 14px 16px; }
.quick { display: grid; grid-template-columns: minmax(0, 1fr) 9.5rem; gap: 10px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
input[type=text], input[type=number], input[type=search], input[type=date], input[type=password], select, textarea {
  width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 16px;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
nav.tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; }
nav.tabs a { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 10px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: .95rem; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
nav.tabs a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
nav.tabs a .dot { display: inline-block; min-width: 1.4em; padding: 0 .35em; border-radius: 999px; background: var(--tag); color: var(--tag-ink); font-size: .72rem; text-align: center; }

main { padding-top: calc(56px + env(safe-area-inset-top, 0px) + 22px); padding-bottom: 72px; }
section[data-view] { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
h2 { font-family: var(--font-display); font-stretch: 85%; font-weight: 800; font-size: 1.35rem; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-stretch: 90%; font-weight: 700; font-size: 1.05rem; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spread { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.spread > * { min-width: 0; max-width: 100%; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { padding: 16px 20px; font-size: 1.05rem; width: 100%; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 6px 10px; font-size: .85rem; }
.btn[disabled] { opacity: .5; cursor: default; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chip { flex: 0 0 auto; padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: .88rem; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
nav.tabs a.ext { color: var(--tag); border-color: color-mix(in srgb, var(--tag) 40%, var(--line)); }
/* Bevakningar: ett rutnät som radbryts, aldrig sidoskroll. */
.watch-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.watch { display: grid; gap: 2px; text-align: left; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; min-width: 0; }
.watch b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.watch span { font-size: .78rem; color: var(--muted); }
.watch[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }
.watch.big { border-color: color-mix(in srgb, var(--tag) 45%, var(--line)); }
.watch.big b::before { content: "★ "; color: var(--tag); }
.sub-pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
/* Träffar i stora databasen (sök och direktsvar) */
.db-hits { display: grid; gap: 8px; }
.db-hit { display: flex; justify-content: space-between; gap: 12px; align-items: center; text-align: left; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.db-hit:hover { border-color: var(--muted); }
.db-hit-main { display: grid; gap: 4px; min-width: 0; }
.db-hit-main b { text-transform: capitalize; overflow-wrap: anywhere; }
.db-hit-p { display: grid; justify-items: end; text-align: right; flex: 0 0 auto; }
.db-hit-p b { font-family: var(--font-display); font-size: 1.2rem; font-stretch: 88%; }
.instant { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 14px; align-items: start; padding-top: 14px; border-top: 1px solid var(--line); }
.instant:first-of-type { border-top: 0; padding-top: 0; }
.instant .photo { width: 88px; aspect-ratio: 1; object-fit: cover; border-radius: 10px; }
.instant .fynd { display: grid; gap: 10px; min-width: 0; }
.instant h3 { font-size: 1.15rem; text-transform: none; }
.own-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 15px; line-height: 1.45; resize: vertical; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 18px; display: grid; gap: 16px; min-width: 0; }
.note { padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); font-size: .92rem; }
.note.warn { background: var(--warn-bg); }
.note.bad { background: var(--bad-bg); color: var(--bad); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; grid-template-rows: auto 1fr; cursor: pointer; text-align: left; padding: 0; position: relative; }
.card:hover { border-color: var(--muted); }
.thumbs { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 2px; aspect-ratio: 16 / 9; background: var(--surface-2); max-width: 100%; overflow: hidden; }
.thumbs img { width: 100%; height: 100%; min-height: 0; object-fit: cover; display: block; }
.thumbs img:first-child { grid-row: 1 / 3; }
.thumbs .ph { display: grid; place-items: center; color: var(--muted); font-size: .8rem; grid-column: 1 / -1; grid-row: 1 / -1; }
.card .body { padding: 14px 16px 16px; display: grid; gap: 10px; align-content: start; }
.card .name { font-family: var(--font-display); font-weight: 700; font-stretch: 88%; font-size: 1.12rem; line-height: 1.15; text-transform: capitalize; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: .78rem; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: .75rem; }
.pill.fast { background: var(--good-bg); color: var(--good); }
.pill.mid { background: var(--warn-bg); color: var(--warn); }
.pill.slow { background: var(--bad-bg); color: var(--bad); }
.pill.lim { background: #3A1F47; color: #E9A8FF; }
.pill.bw { background: #0F2E33; color: #6FE0E8; }
.prices { display: flex; align-items: end; justify-content: space-between; gap: 8px; }
.sells { display: grid; font-size: .8rem; color: var(--muted); }
.sells b { font-family: var(--font-display); font-size: 1.15rem; color: var(--ink); font-stretch: 90%; }

.tag { position: relative; display: inline-grid; padding: 5px 12px 5px 22px; background: var(--tag); color: var(--tag-ink);
  clip-path: polygon(12px 0, 100% 0, 100% 100%, 12px 100%, 0 50%); border-radius: 0 6px 6px 0; line-height: 1.05; text-align: right; }
.tag::before { content: ""; position: absolute; left: 9px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--surface); }
.tag small { font-size: .62rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.tag b { font-family: var(--font-display); font-weight: 800; font-stretch: 80%; font-size: 1.45rem; font-variant-numeric: tabular-nums; }
.tag.none { background: var(--surface-2); color: var(--muted); }
.tag.big b { font-size: 2.2rem; }

.verdict { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; font-weight: 700; font-size: .9rem; }
.verdict.buy { background: var(--good-bg); color: var(--good); }
.verdict.maybe { background: var(--warn-bg); color: var(--warn); }
.verdict.skip { background: var(--bad-bg); color: var(--bad); }
.verdict span { font-weight: 500; font-size: .82rem; }

.sheet-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 20; display: grid; align-items: end; justify-items: center; }
.sheet { background: var(--bg); width: min(860px, 100%); max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0;
  padding-block: 16px calc(24px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
@media (min-width: 760px) { .sheet-bg { align-items: center; } .sheet { border-radius: 16px; } }
.sheet-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.sheet-head h2 { text-transform: capitalize; font-size: 1.6rem; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kv > div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.kv b { font-family: var(--font-display); font-size: 1.3rem; font-stretch: 88%; font-variant-numeric: tabular-nums; }
.kv span { font-size: .78rem; color: var(--muted); }
.listings { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.listing { display: grid; gap: 4px; text-decoration: none; color: var(--ink); font-size: .82rem; min-width: 0; }
.listing img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--surface-2); }
.listing .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.listing .p { display: flex; justify-content: space-between; font-weight: 700; }
.src { font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.src.t { color: var(--tradera); } .src.b { color: var(--blocket); }
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; width: 100%; min-width: 520px; height: auto; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; }

.table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.table th, .table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table th { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.table td.r, .table th.r { text-align: right; font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; }
.tile b { font-family: var(--font-display); font-weight: 800; font-stretch: 82%; font-size: 1.7rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile span { font-size: .78rem; color: var(--muted); }
.pos { color: var(--good); } .neg { color: var(--bad); }
.inv { display: grid; gap: 8px; }
.inv-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; }
.inv-item .controls { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.inv-item .title { font-weight: 600; text-transform: capitalize; }
.bar { height: 10px; border-radius: 3px; background: var(--accent); }
.barrow { display: grid; grid-template-columns: minmax(90px, 9rem) minmax(0, 1fr) 5.5rem; gap: 10px; align-items: center; font-size: .88rem; }
.barrow .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: capitalize; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: .88em; overflow-wrap: anywhere; }
.empty { text-align: center; padding: 32px 16px; display: grid; gap: 10px; justify-items: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 30; font-weight: 600; font-size: .9rem; max-width: calc(100% - 32px); }

/* Foto */
.shot { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; align-items: start; }
.shot img.photo { width: 120px; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--surface-2); }
.filters > summary { cursor: pointer; list-style: none; padding: 10px 0 2px; }
.filters > summary::-webkit-details-marker { display: none; }
.filters > summary::after { content: " ▾"; color: var(--muted); }
.filters[open] > summary::after { content: " ▴"; }
.filter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px 12px; margin-top: 12px; }
@media (max-width: 480px) { .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.photo-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.batch { display: grid; gap: 10px; }
.batch-item { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 12px; align-items: end; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.batch-item img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
details.panel > summary { cursor: pointer; list-style: none; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: " ▾"; color: var(--muted); }
details.panel[open] > summary::after { content: " ▴"; }
.login input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.preview { width: 100%; max-height: 320px; object-fit: contain; border-radius: 8px; background: var(--surface-2); }
.fynd { display: grid; gap: 12px; }
.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.cmp { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; cursor: pointer; background: var(--bg); text-align: left; }
.cmp:hover { border-color: var(--muted); }
.cmp .mini { display: flex; gap: 4px; overflow: hidden; }
.cmp .mini img { width: 54px; height: 54px; object-fit: cover; border-radius: 6px; flex: 0 0 auto; }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 480px) {
  .quick { grid-template-columns: minmax(0, 1fr) 7.5rem; }
  .menu-btn #menuLabel { display: none; }
  .menu-btn { padding: 10px 12px; }
  .panel { padding: 18px 16px; }
  .sheet-head h2 { font-size: 1.4rem; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .card { grid-template-columns: 118px minmax(0, 1fr); grid-template-rows: none; }
  .card .thumbs { aspect-ratio: auto; height: 100%; min-height: 136px; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  .card .thumbs img:not(:first-child) { display: none; }
  .card .thumbs img:first-child { grid-row: auto; }
  .card .verdict { grid-column: 1 / -1; }
  .tag b { font-size: 1.25rem; }
  .shot { grid-template-columns: 84px minmax(0, 1fr); }
  .shot img.photo { width: 84px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* Flippa */
.flip-btn { text-decoration: none; color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.hype-btn { text-decoration: none; color: var(--tag-ink); background: var(--tag); border-color: var(--tag); }
@media (max-width: 420px) { .topbar .flip-btn, .topbar .hype-btn { padding: 8px 10px; } .topbar { gap: 6px; } }
.hype-sub { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .85rem; color: var(--muted); }
.hype-sub b, .hype-line b { color: var(--ink); font-variant-numeric: tabular-nums; }
.hype-line { font-size: .85rem; color: var(--muted); line-height: 1.45; }
.hot-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.hot-row:first-child { border-top: 0; }
.hot-row .k { font-weight: 700; text-transform: capitalize; }
.hot-row .mini { grid-column: 1 / -1; display: flex; gap: 6px; overflow: hidden; }
.hot-row .mini a { flex: 0 0 64px; }
.hot-row .mini img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: var(--surface-2); }
.src-list { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .78rem; }
.src.f { color: #C9A0FF; }
.fb-list { display: grid; gap: 6px; }
.fb-list a { display: flex; justify-content: space-between; gap: 10px; color: var(--ink); text-decoration: none; font-size: .85rem; }
.fb-list a span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.how summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
details.how p { margin: 8px 0 0; }
.flips { display: grid; gap: 10px; }
.flip { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.flip.open { border-color: var(--muted); }
.flip-head { all: unset; box-sizing: border-box; width: 100%; display: flex; gap: 12px; justify-content: space-between; align-items: center; padding: 14px 16px; cursor: pointer; }
.flip-head:focus-visible { outline: 2px solid var(--accent); border-radius: var(--r); }
.flip-main { display: grid; gap: 5px; min-width: 0; }
.flip-name { font-weight: 700; font-size: 1.05rem; text-transform: capitalize; overflow-wrap: anywhere; }
.flip-profit { font-weight: 800; font-size: 1.1rem; white-space: nowrap; color: var(--muted); }
.flip-profit.buy { color: var(--good); } .flip-profit.maybe { color: var(--warn); }
.flip-body { display: grid; gap: 12px; padding: 0 16px 16px; min-width: 0; }
.flip-body .table { font-size: .8rem; } .flip-body .table th, .flip-body .table td { padding: 6px 4px; white-space: nowrap; }
.flip-body .chart svg { min-width: 0; }
.listing .ph { aspect-ratio: 1; background: var(--surface-2); border-radius: 8px; }
</style>
</head>
<body>

      <div class="quick">

          <input id="q" type="search" placeholder="t.ex. mon amie, game boy, kånken" autocomplete="off" enterkeyhint="search">

<input id="photoPick" type="file" accept="image/*" multiple hidden>
<input id="invImport" type="file" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';
const CATS = ['Möbler & stolar', 'Porslin & glas', 'Elektronik & retro', 'Kläder & märken', 'Barn & fritid', 'Övrigt'];
const DEFAULT_CFG = { minProfit: 100, minMult: 2, mode: 'any', valuation: 'bal', platform: 'tradera',
  traderaPct: 10, traderaMin: 3, traderaCap: 200, blocketFee: 0, haggle: 20,
  packCost: 0, payShip: false, shipCost: 59 };   // frakt: förpackning per försäljning, och om du själv betalar frakten
const TABS = ['fynd', 'foto', 'lager', 'flippa', 'hype', 'databas', 'statistik', 'installningar'];

// ---------- lagring på enheten ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function guessRepo() {
  const h = location.hostname;
  if (h.endsWith('.github.io')) { const owner = h.split('.')[0]; const repo = location.pathname.split('/').filter(Boolean)[0] || `${owner}.github.io`; return { owner, repo }; }
  return { owner: '', repo: 'thriftkollen' };
}
// Nyckeln: localStorage om "kom ihåg mig", annars sessionStorage (glöms när fliken stängs).
const tokenStore = {
  get() { try { return localStorage.getItem('tk-token') || sessionStorage.getItem('tk-token') || ''; } catch { return ''; } },
  set(t, remember) { try { localStorage.removeItem('tk-token'); sessionStorage.removeItem('tk-token'); if (t) (remember ? localStorage : sessionStorage).setItem('tk-token', t); } catch {} },
  remembered() { try { return !!localStorage.getItem('tk-token'); } catch { return false; } },
};
const ghSaved = store.get('tk-github', {});
if (ghSaved.token) { tokenStore.set(ghSaved.token, true); delete ghSaved.token; store.set('tk-github', ghSaved); }
const gh = Object.assign({ branch: 'main' }, guessRepo(), ghSaved, { token: tokenStore.get() });

const S = { terms: new Map(), fynd: [], meta: null, inv: store.get('tk-inventory', []), cfg: { ...DEFAULT_CFG, ...store.get('tk-settings', {}) },
  pending: store.get('tk-pending', []), state: 'loading', loadErr: null, tab: 'fynd', cat: store.get('tk-cat', 'Alla'), sort: store.get('tk-sort', 'max'),
  q: '', price: null, open: null, confirm: null, photos: [], photoCat: '', uploading: false, run: null, fyndPrice: {}, auth: null, menuOpen: false,
  watches: null, dbIndex: new Map(), bcats: null, dbSel: store.get('tk-dbsel', null), db: null, dbLoading: false, dbMetaLoaded: false, dbMetaLoading: false, dbShowForm: false, dbLimit: 60,
  dbFilter: { status: 'active', cond: '', reg: '', seller: '', brand: '', min: '', max: '', km: '', q: '', sort: 'new' } };

// ---------- hjälpare ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const kr = n => (n == null || !isFinite(n)) ? '–' : Math.round(n).toLocaleString('sv-SE') + ' kr';
const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/\p{Mn}/gu, '').replace(/[^\p{L}\p{N} ]+/gu, '').replace(/\s+/g, ' ').trim();
const slug = q => norm(q).replace(/ /g, '-').slice(0, 120);
const safeUrl = u => /^https:\/\/(www\.)?(tradera\.com|blocket\.se)\//.test(u || '') ? u : null;
const safeImg = u => /^https:\/\/(images\.blocketcdn\.se|img\.tradera\.net)\//.test(u || '') || /^data:image\/jpeg;base64,/.test(u || '') ? u : null;
const daysAgo = iso => { const d = (Date.now() - new Date(iso)) / 864e5; return isFinite(d) ? d : null; };
const when = iso => { const d = daysAgo(iso); if (d == null) return '–'; if (d < 1 / 24) return Math.max(1, Math.round(d * 1440)) + ' min sedan'; if (d < 1) return Math.round(d * 24) + ' h sedan'; return Math.round(d) + ' d sedan'; };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200); }
// Data som ändras ofta (scrape, foton, sökord) ligger på grenen "data", så att varje foto inte bygger om hela sidan.
const DATA_BRANCH = 'data';
const branchFor = path => /^(data\/(thriftdata|fynd|sokord)\.json|queue\/|uploads\/)/.test(path) ? DATA_BRANCH : gh.branch;
const rawUrl = path => `https://raw.githubusercontent.com/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}/${branchFor(path)}/${path}`;
const b64 = str => { const bytes = new TextEncoder().encode(str); let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const fromB64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0)));

// ---------- GitHub ----------
async function api(path, opts = {}) {
  const headers = { 'Accept': opts.accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (gh.token) headers.Authorization = `Bearer ${gh.token}`;
  if (opts.body) headers['Content-Type'] = 'application/json';
  const r = await fetch(`https://api.github.com${path}`, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: 'no-store' });
  if (!r.ok) {
    let msg = `${r.status}`; try { msg += ' ' + (await r.json()).message; } catch {}
    const e = new Error(msg); e.status = r.status; throw e;
  }
  return r.status === 204 ? null : (opts.accept && opts.accept.includes('raw') ? r.text() : r.json());
}
const repoPath = p => `/repos/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}${p}`;
async function readRepoJson(path) {
  if (gh.token && gh.owner) {
    try { return JSON.parse(await api(repoPath(`/contents/${path}?ref=${branchFor(path)}`), { accept: 'application/vnd.github.raw+json' })); } catch (e) { if (e.status === 404) return null; }
  }
  let r = null;
  if (gh.owner) { try { r = await fetch(rawUrl(path), { cache: 'no-store' }); if (!r.ok && r.status !== 404) r = null; } catch { r = null; } }
  if (!r) r = await fetch(`./${path}?t=${Date.now()}`, { cache: 'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function putFile(path, contentB64, message, sha) {
  return api(repoPath(`/contents/${path}`), { method: 'PUT', body: { message, content: contentB64, branch: branchFor(path), ...(sha ? { sha } : {}) } });
}
async function updateRepoJson(path, mutate, message) {
  for (let attempt = 0; attempt < 3; attempt++) {
    const cur = await api(repoPath(`/contents/${path}?ref=${branchFor(path)}`));
    const data = JSON.parse(fromB64(cur.content));
    const next = mutate(data);
    try { return await putFile(path, b64(JSON.stringify(next, null, 1)), message, cur.sha); }
    catch (e) { if (e.status !== 409) throw e; }
  }
  throw new Error('Filen ändrades samtidigt. Försök igen.');
}
// full = alla sökord, annars bara nya foton i kön.
async function dispatchScrape(full = true) {
  await api(repoPath('/actions/workflows/scrape.yml/dispatches'), { method: 'POST', body: { ref: gh.branch, inputs: { full } } });
}
async function dispatchDb(id) {
  await api(repoPath('/actions/workflows/databas.yml/dispatches'), { method: 'POST', body: { ref: gh.branch, inputs: { bevakning: id } } });
}
async function latestRun() {
  try { const r = await api(repoPath('/actions/workflows/scrape.yml/runs?per_page=1')); return r.workflow_runs && r.workflow_runs[0]; } catch { return null; }
}

// ---------- data ----------
async function loadData(quiet) {
  try {
    const [td, fy] = await Promise.all([readRepoJson('data/thriftdata.json'), readRepoJson('data/fynd.json')]);
    if (td) { S.terms = new Map((td.terms || []).map(t => [t.id, t])); S.meta = { generatedAt: td.generatedAt }; }
    S.fynd = (fy && fy.items) || [];
    const doneAt = new Map(S.fynd.map(f => [f.id, f.processedAt || '']));
    const before = S.pending.length;
    S.pending = S.pending.filter(p => !(doneAt.has(p.id) && doneAt.get(p.id) >= p.createdAt) && daysAgo(p.createdAt) < 1);
    if (S.pending.length !== before) { store.set('tk-pending', S.pending); if (!quiet || before > S.pending.length) toast('Fotot är scrapat. Resultatet ligger under Fota.'); }
    S.state = 'ready'; S.loadErr = null;
  } catch (e) { S.loadErr = e.message; if (S.state === 'loading') S.state = 'error'; }
  render();
}
let pollTimer = null;
function schedulePoll() {
  clearTimeout(pollTimer);
  if (!S.pending.length) { S.run = null; return; }
  pollTimer = setTimeout(async () => { if (gh.token) S.run = await latestRun(); await loadData(true); schedulePoll(); }, 15000);
}

// ---------- ekonomi ----------
function fee(platform, price) {
  const c = S.cfg;
  if (platform === 'tradera') return Math.min(c.traderaCap, Math.max(c.traderaMin, price * c.traderaPct / 100));
  if (platform === 'blocket') return c.blocketFee;
  return 0;
}
function valuation(t) {
  if (!t) return null;
  const T = t.tradera && t.tradera.stats, B = t.blocket && t.blocket.stats;
  const tv = T && T.n >= 3 ? T.med : null;
  const bv = B && B.n >= 3 ? B.med * (1 - S.cfg.haggle / 100) : null;
  const vals = [tv, bv].filter(v => v != null);
  if (!vals.length) return null;
  let resale;
  if (S.cfg.valuation === 'safe') resale = tv ?? bv;
  else if (S.cfg.valuation === 'opt') resale = Math.max(...vals);
  else resale = vals.reduce((a, b) => a + b, 0) / vals.length;
  const net = resale - fee(S.cfg.platform, resale) - extraCost();
  return { resale, net, tv, bv, max: maxBuy(net) };
}
// Egna kostnader per försäljning: förpackning, och frakten om du bjuder på den (annars betalar köparen).
function extraCost(ship) { const c = S.cfg; return (+c.packCost || 0) + (c.payShip ? (ship || +c.shipCost || 0) : 0); }
function maxBuy(net) {
  const a = net - S.cfg.minProfit, b = net / S.cfg.minMult;
  const v = S.cfg.mode === 'all' ? Math.min(a, b) : Math.max(a, b);
  return v >= 5 ? Math.floor(v / 5) * 5 : 0;
}
function verdict(v, price) {
  if (!v || price == null || price < 0) return null;
  const profit = v.net - price, mult = price > 0 ? v.net / price : Infinity;
  const okP = profit >= S.cfg.minProfit, okM = mult >= S.cfg.minMult;
  const ok = S.cfg.mode === 'all' ? okP && okM : okP || okM;
  const cls = ok ? 'buy' : (profit > 0 && price <= v.max * 1.25 + 10 ? 'maybe' : 'skip');
  return { cls, label: cls === 'buy' ? 'Köp' : cls === 'maybe' ? 'Kanske, pruta' : 'Skippa', profit, mult };
}
function speed(t) {
  const B = t && t.blocket && t.blocket.stats;
  if (!B || B.ageMed == null || B.n < 3) return { cls: '', label: 'Okänd takt', rank: 999 };
  const a = B.ageMed;
  if (a <= 14) return { cls: 'fast', label: 'Säljer snabbt', rank: a };
  if (a <= 45) return { cls: 'mid', label: 'Medeltakt', rank: a };
  return { cls: 'slow', label: 'Säljer långsamt', rank: a };
}
const dataCount = t => ((t.tradera && t.tradera.stats && t.tradera.stats.n) || 0) + ((t.blocket && t.blocket.stats && t.blocket.stats.n) || 0);
const verdictHTML = (vd, round) => vd ? `<div class="verdict ${vd.cls}" ${round ? 'style="border-radius:8px"' : ''}>${vd.label}<span class="num">${vd.profit >= 0 ? '+' : ''}${kr(vd.profit)} · x${isFinite(vd.mult) ? vd.mult.toFixed(1) : '∞'}</span></div>` : '';
const tagHTML = (v, big, label = 'Max i butik') => v && v.max > 0 ? `<div class="tag ${big ? 'big' : ''}"><small>${label}</small><b>${kr(v.max)}</b></div>`
  : `<div class="tag none ${big ? 'big' : ''}"><small>${label}</small><b>${v ? 'Lönar ej' : '–'}</b></div>`;

// ---------- sök ----------
function matches(t, q) {
  if (!q) return 1;
  const hay = norm(t.q + ' ' + (t.must || '') + ' ' + t.cat);
  const qt = norm(q).split(' ').filter(Boolean);
  let score = 0;
  for (const w of qt) { if (hay.includes(w)) score += 2; else if (w.length >= 4 && hay.split(' ').some(h => h.startsWith(w.slice(0, 4)))) score += 1; }
  const mustT = norm(t.must && t.must !== '*' ? t.must : t.q).split(' ').filter(w => w.length >= 2);
  if (mustT.length && mustT.every(m => norm(q).includes(m))) score += 3;
  return score >= Math.max(2, qt.length) ? score : 0;
}
const searchLinks = q => {
  const e = encodeURIComponent(q);
  return `<a class="btn small" target="_blank" rel="noopener" href="https://www.tradera.com/search?q=${e}&itemStatus=Ended">Sålda på Tradera ↗</a>
    <a class="btn small" target="_blank" rel="noopener" href="https://www.blocket.se/recommerce/forsale/search?q=${e}">Blocket ↗</a>
    <a class="btn small" target="_blank" rel="noopener" href="https://www.facebook.com/marketplace/stockholm/search?query=${e}">FB Marketplace ↗</a>`;
};
const imgTag = (src, cls = '') => `<img src="${src}" alt="" loading="lazy" referrerpolicy="no-referrer" ${cls ? `class="${cls}"` : ''}>`;

// ---------- vy: Katalog ----------
function cardHTML(t) {
  const v = valuation(t), sp = speed(t), vd = verdict(v, S.price);
  const imgs = (t.listings || []).map(l => safeImg(l.img)).filter(Boolean).slice(0, 3);
  const thumbs = imgs.length ? imgs.map(s => imgTag(s)).join('') : `<div class="ph">Ingen bild</div>`;
  const low = dataCount(t) < 6 ? '<span class="pill">Lite data</span>' : '';
  const foto = t.source === 'foto' ? '<span class="pill">Från foto</span>' : '';
  return `<button class="card" data-open="${esc(t.id)}" aria-label="${esc(t.q)}">
    <div class="thumbs">${thumbs}</div>
    <div class="body">
      <div class="name">${esc(t.q)}</div>
      <div class="meta"><span class="pill">${esc(t.cat)}</span><span class="pill ${sp.cls}">${sp.label}</span>${low}${foto}</div>
      <div class="prices"><div class="sells">Säljs för ca<b class="num">${v ? kr(v.resale) : '–'}</b></div>${tagHTML(v)}</div>
    </div>${verdictHTML(vd)}</button>`;
}
function renderFynd() {
  const el = $('#v-fynd');
  if (S.state === 'loading') { el.innerHTML = `<div class="empty muted"><span class="spinner"></span>Hämtar katalogen…</div>`; return; }
  if (S.state === 'error') { el.innerHTML = `<div class="note bad">Kunde inte läsa datan: ${esc(S.loadErr)}. Kolla anslutningen under Inställningar.</div>`; return; }
  const all = [...S.terms.values()];
  if (!all.length) { el.innerHTML = `<div class="panel empty"><h2>Katalogen är tom</h2><p class="muted">Kör en full scrape under Inställningar.</p></div>`; return; }
  const cats = ['Alla', ...CATS.filter(c => all.some(t => t.cat === c))];
  if (!cats.includes(S.cat)) S.cat = 'Alla';
  const scored = all.filter(t => S.cat === 'Alla' || t.cat === S.cat).map(t => [t, matches(t, S.q)]).filter(([, s]) => s > 0);
  let list = scored.map(([t]) => t);
  const vc = new Map(list.map(t => [t.id, valuation(t)]));
  const sorters = {
    max: (a, b) => (vc.get(b.id)?.max ?? -1) - (vc.get(a.id)?.max ?? -1),
    value: (a, b) => (vc.get(b.id)?.resale ?? -1) - (vc.get(a.id)?.resale ?? -1),
    fast: (a, b) => speed(a).rank - speed(b).rank,
    name: (a, b) => a.q.localeCompare(b.q, 'sv'),
  };
  if (S.q) { const sc = new Map(scored.map(([t, s]) => [t.id, s])); list.sort((a, b) => sc.get(b.id) - sc.get(a.id) || sorters[S.sort](a, b)); } else list.sort(sorters[S.sort]);
  const fallback = S.q && !list.length ? `<div class="panel"><h3>Ingen träff på ”${esc(S.q)}” i katalogen</h3>
      <p class="muted">Fota varan så scrapas den automatiskt, eller kolla priset direkt.</p>
      <div class="row"><a class="btn primary small" href="#foto">Fota och scrapa</a>${searchLinks(S.q)}</div></div>` : '';
  const hint = S.q && list.length ? `<div class="row muted small">Inte rätt vara? ${searchLinks(S.q)}</div>` : '';
  el.innerHTML = `
    <div class="spread">
      <div class="chips" role="group" aria-label="Kategori">${cats.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${S.cat === c}">${esc(c)}</button>`).join('')}</div>
      <div class="row"><label class="lbl" for="sort">Sortera</label>
        <select id="sort" style="width:auto">
          ${[['max', 'Högst maxpris'], ['value', 'Högst säljvärde'], ['fast', 'Säljer snabbast'], ['name', 'A–Ö']].map(([k, l]) => `<option value="${k}" ${S.sort === k ? 'selected' : ''}>${l}</option>`).join('')}
        </select></div>
    </div>
    ${S.price != null ? `<div class="note">Visar köpbesked för butikspris <b class="num">${kr(S.price)}</b>. Kravet är ${ruleText()}.</div>` : ''}
    ${S.q ? dbSearchHTML(S.q) : ''}${fallback}${hint}

// Lägger upp flera filer i en enda commit (Git Data API), så att GitHub bara startar en körning för hela omgången.

  const prompt = `Du hjälper en person i Stockholm som köper saker på en second hand-butik och säljer dem vidare på Blocket och Tradera.
Identifiera varan på bilden så att vi kan söka fram jämförbara annonser. ${hint}

Fält:
- name: kort svenskt namn på varan, med märke och modell om de syns (t.ex. "Thule Yepp Maxi barncykelstol").
- brand och model: tom sträng om det inte går att avgöra. Gissa inte fram en modell.
- category: välj en av: ${CATS.join(', ')}.
- specificQuery: 2-4 ord som hittar samma märke/modell på Blocket och Tradera, skrivet som svenska säljare skriver annonsrubriker. Om märket är okänt: samma som genericQuery.
- specificMust: 1-2 ord som måste stå i annonsrubriken (oftast märket), mellanslagsseparerade. '*' om inget krav.
- genericQuery: 1-3 ord för varutypen i stort på svenska, som det skrivs i annonser (t.ex. "barncykelstol"), för att jämföra prisnivån mellan märken.
- genericMust: ett ord som måste stå i rubriken, eller '*' om rubrikerna varierar för mycket.
- notes: en kort svensk mening om vad som påverkar priset mest för just den här varan.
- confidence: low, medium eller high.`;
  const r = await claude({ model: AI_MODEL, max_tokens: 8000, output_config: { effort: 'low', format: { type: 'json_schema', schema: ID_SCHEMA } },
    messages: [{ role: 'user', content: [{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: dataUrl.split(',')[1] } }, { type: 'text', text: prompt }] }] });
  const ai = aiJson(r); ai.model_used = r.model; ai.usage = aiCost(r); ai.source = 'app';
  return ai;
}

// kombo/terms.json: alla varutyper med priser från Blocket och Tradera (byggs varje natt). Laddas en gång och sparas av webbläsaren.
const KT = { map: null, p: null };
function loadKTerms() {
  if (KT.map) return Promise.resolve(KT.map);
  return KT.p || (KT.p = readDbFile('kombo/terms.json').then(d => {
    KT.map = new Map(d ? d.rows.map(r => { const o = rowObj(d.cols, r); return [o.k, o]; }) : []);
    FS.terms = [...KT.map.values()]; render(); return KT.map;
  }).catch(() => (KT.map = new Map())));
}
function wordKeys(text) {
  const ws = ((text || '').toLowerCase().match(/[\p{L}\p{N}]+/gu) || []).filter(x => x.length >= 3 && !/^\d+$/.test(x));
  const o = new Set(ws); for (let i = 0; i + 1 < ws.length; i++) if (ws[i] !== ws[i + 1]) o.add(ws[i] + ' ' + ws[i + 1]);
  return [...o];
}
// Bästa varutyperna för en text: pålitliga först, ordpar före enstaka ord, mycket data före lite.
function lookupTerms(text, n = 5) {
  if (!KT.map) { loadKTerms(); return null; }
  const W = { 3: 30, 2: 22, 1: 8, 0: 0 };
  const hits = wordKeys(text).map(k => KT.map.get(k)).filter(Boolean)
    .map(t => ({ t, s: (W[t.conf] || 0) + (t.k.includes(' ') ? 6 : 0) + Math.log10(1 + t.bN + t.tN) * 3 + (t.fair > 0 ? 5 : 0) })).sort((a, b) => b.s - a.s);
  const out = [];
  for (const h of hits) { if (out.some(o => o.k.includes(' ') && o.k.split(' ').includes(h.t.k))) continue; out.push(h.t); if (out.length >= n) break; }
  return out;
}

}
function dbSearchHTML(q) {
  const hits = lookupTerms(q, 6);
  if (hits === null) return `<div class="panel"><h3>I stora databasen</h3><div class="muted small"><span class="spinner"></span>Laddar Blocket + Tradera…</div></div>`;

function adPrices(src) {

}

// Lagret sparas krypterat i data/lager.json på grenen data (nyckeln d i valvet), så att det syns på alla dina enheter.
// Varje sak har updatedAt; borttagna sparas som gravstenar. Vid sammanslagning vinner den senast ändrade.
const LAGER_PATH = 'data/lager.json';
const LS = { status: '', at: store.get('tk-lagersync', null), timer: null, snap: null, busy: false };
const invKey = i => JSON.stringify({ ...i, updatedAt: undefined });
function stampInv() {
  const now = new Date().toISOString(), tomb = store.get('tk-inv-deleted', {});
  if (!LS.snap) LS.snap = new Map(store.get('tk-inv-snap', []));
  const ids = new Set();
  for (const i of S.inv) { ids.add(i.id); const k = invKey(i); if (LS.snap.get(i.id) !== k) { i.updatedAt = now; LS.snap.set(i.id, k); } }
  for (const id of [...LS.snap.keys()]) if (!ids.has(id)) { tomb[id] = now; LS.snap.delete(id); }
  store.set('tk-inv-snap', [...LS.snap]); store.set('tk-inv-deleted', tomb);
}
async function dataKey() { return crypto.subtle.importKey('raw', b64ToBytes(vault.d), 'AES-GCM', false, ['encrypt', 'decrypt']); }
async function syncLager() {
  if (!gh.token || !vault.d || LS.busy) return;
  LS.busy = true; LS.status = 'Synkar…';
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      let remote = { items: [], deleted: {} }, sha;
      try {
        const cur = await api(repoPath(`/contents/${LAGER_PATH}?ref=${DATA_BRANCH}`)); sha = cur.sha;
        const blob = JSON.parse(fromB64(cur.content));
        const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(blob.iv) }, await dataKey(), b64ToBytes(blob.ct));
        remote = JSON.parse(new TextDecoder().decode(pt));
      } catch (e) { if (e.status !== 404 && !(e instanceof SyntaxError)) throw e; }
      // Slå ihop: senast ändrade vinner, gravstenar tar bort saker som inte ändrats efter borttagningen.
      const tomb = { ...(remote.deleted || {}), ...store.get('tk-inv-deleted', {}) };
      const by = new Map();
      for (const i of [...(remote.items || []), ...S.inv]) { const o = by.get(i.id); if (!o || (i.updatedAt || '') > (o.updatedAt || '')) by.set(i.id, i); }
      const merged = [...by.values()].filter(i => !(tomb[i.id] && tomb[i.id] >= (i.updatedAt || '')));
      const changedLocal = JSON.stringify(merged.map(invKey).sort()) !== JSON.stringify(S.inv.map(invKey).sort());
      S.inv = merged; store.set('tk-inventory', S.inv);
      LS.snap = new Map(S.inv.map(i => [i.id, invKey(i)])); store.set('tk-inv-snap', [...LS.snap]);
      const doc = { v: 1, updatedAt: new Date().toISOString(), items: merged, deleted: tomb };
      const same = JSON.stringify(merged.map(invKey).sort()) === JSON.stringify((remote.items || []).map(invKey).sort());
      if (same && sha) { store.set('tk-inv-deleted', {}); if (changedLocal) render(); break; }
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await dataKey(), new TextEncoder().encode(JSON.stringify(doc))));
      try { await putFile(LAGER_PATH, b64(JSON.stringify({ v: 1, cipher: 'AES-GCM-256', iv: bytesToB64(iv), ct: bytesToB64(ct) })), 'Lager', sha); store.set('tk-inv-deleted', {}); if (changedLocal) render(); break; }
      catch (e) { if (e.status !== 409 && e.status !== 422) throw e; }
    }
    LS.at = new Date().toISOString(); store.set('tk-lagersync', LS.at); LS.status = '';
  } catch (e) { LS.status = 'Kunde inte synka: ' + e.message; }
  LS.busy = false; if (S.tab === 'lager') render();
}
function queueSync() { clearTimeout(LS.timer); LS.timer = setTimeout(syncLager, 2500); }

      d: (() => { const d = l.map(held).filter(x => x != null); return d.length ? d.reduce((a, b) => a + b, 0) / d.length : null; })() })); };
  const months = group(i => (i.soldAt || '').slice(0, 7)).sort((a, b) => a.k.localeCompare(b.k)).slice(-12);

// ---------- vakt: startar nattens körningar om GitHub har tappat dem ----------
async function watchdog() {
  if (!gh.token || !gh.owner) return;
  const last = store.get('tk-watchdog', 0); if (Date.now() - last < 3 * 3600e3) return;
  try {
    const running = async wf => { const r = await api(repoPath(`/actions/workflows/${wf}/runs?per_page=5`)); return (r.workflow_runs || []).some(x => x.status !== 'completed'); };
    const idx = await readDbFile('index.json');
    const age = idx && idx.updatedAt ? (Date.now() - new Date(idx.updatedAt)) / 36e5 : 999;
    if (age > 26 && !(await running('databas.yml'))) { await dispatchDb('alla'); store.set('tk-watchdog', Date.now()); toast('Nattens databaskörning hade inte gått. Den är startad nu.'); }
    const cat = S.meta && S.meta.generatedAt ? (Date.now() - new Date(S.meta.generatedAt)) / 864e5 : 0;
    if (cat > 5 && !(await running('scrape.yml'))) { await dispatchScrape(true); store.set('tk-watchdog', Date.now()); }
  } catch {}
}

// ---------- vy: Flippa (gemensam databas för Blocket + Tradera) ----------
// Läser kombo/flip.json från grenen db (byggs varje natt av scripts/kombo.ps1).
// Ett "ord" är en varutyp ur rubrikerna, t.ex. "vinteroverall" eller "maxi cosi". Pålitliga ord (conf > 0) har samlade priser:
// conf 3 = Tradera (sålda) och Blocket är överens, 2 = Blocket med sålda (försvunna) annonser, 1 = bara utropspriser på Blocket.
const CONF = { 3: ['Säker', 'fast', 'Tradera-sålda och Blocket är överens'], 2: ['Blocket-sålda', 'mid', 'Bygger på annonser som sålts på Blocket'], 1: ['Bara utropspris', 'slow', 'Bara vad folk begär på Blocket, osäkert'], 0: ['Spretigt', 'slow', 'Priserna spretar, olika saker under samma ord'] };
const FS = { data: null, loading: false, err: null, mode: store.get('tk-flipmode', 'typer'), max: store.get('tk-flipmax', 300), all: store.get('tk-flipall', false),
  q: '', open: null, limit: 40, terms: null, termsLoading: false, shards: new Map(), fb: null };
const fnv = s => { let h = 0x811c9dc5; for (const b of new TextEncoder().encode(s)) { h ^= b; h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; };
const rowObj = (cols, r) => { const o = {}; cols.forEach((c, i) => o[c] = r[i]); return o; };
async function loadFlip(force) {
  if ((FS.data || FS.loading) && !force) return;
  FS.loading = true; FS.err = null;
  try {
    const [d, fb] = await Promise.all([readDbFile('kombo/flip.json'), readRepoJson('data/fb.json').catch(() => null)]);
    FS.fb = fb && fb.terms ? fb : null;
    if (d) { d._terms = d.terms.map(r => rowObj(d.cols, r)); d._byK = new Map(d._terms.map(t => [t.k, t])); d._deals = d.deals.map(r => rowObj(d.dealCols, r)); }
    FS.data = d;
  } catch (e) { FS.err = e.message; }
  FS.loading = false; render();
}
async function loadAllTerms() {
  if (FS.terms || FS.termsLoading) return;
  FS.termsLoading = true; await loadKTerms(); FS.terms = FS.terms || []; FS.termsLoading = false; render();
}
async function loadTrend(k) {
  const n = String(fnv(k) % 32).padStart(2, '0');
  if (FS.shards.has(n)) return;
  FS.shards.set(n, null);
  try { FS.shards.set(n, await readDbFile(`kombo/trend/${n}.json`)); } catch { FS.shards.set(n, { terms: {} }); }
  render();
}
// Rättvist pris kommer från databasen (t.fair): nedre 90 %-gränsen för medianen av riktiga försäljningar.
// Köppris: ditt butikspris om du skrivit ett, annars billigaste fjärdedelen på Blocket eller Facebook.
function flipVal(t, buyPrice) {
  if (!t || !t.fair) return null;
  const resale = t.fair, platform = (t.src & 1) ? S.cfg.platform : 'blocket';
  const net = resale - fee(platform, resale) - extraCost(t.ship);
  const fb = FS.fb && FS.fb.terms[t.k];
  let buy = buyPrice, buyAt = '';
  if (buy == null) {
    if (S.price != null) { buy = S.price; buyAt = 'i butiken'; }
    else { buy = t.b25; buyAt = 'på Blocket'; if (fb && fb.n >= 5 && fb.p25 < buy) { buy = fb.p25; buyAt = 'på FB'; } }
  }
  const vd = verdict({ net, max: maxBuy(net) }, buy);
  const sold = Math.max(t.tN || 0, t.gN || 0);
  return { resale, net, buy, buyAt, platform, fb, vd, max: maxBuy(net), score: vd ? (t.src === 4 ? .35 : 1) * vd.profit * Math.min(1, sold / 5) : 0 };
}
const SRC = { 1: ['Säker · Tradera-sålda', 'fast'], 2: ['Säker · Blocket-sålda', 'fast'], 3: ['Säker · Tradera + Blocket', 'fast'], 4: ['Uppskattad', 'slow'] };
const confPill = (c, src) => src && SRC[src] ? `<span class="pill ${SRC[src][1]}">${SRC[src][0]}</span>` : `<span class="pill ${CONF[c][1]}" title="${esc(CONF[c][2])}">${CONF[c][0]}</span>`;
const fdays = d => d == null ? '–' : d < 1 ? 'samma dag' : `${Math.round(d)} d`;
function flipCard(t) {
  const v = flipVal(t); if (!v) return '';
  const open = FS.open === t.k;
  const pills = [confPill(t.conf, t.src),
    v.fb && v.fb.n ? `<span class="pill">FB ${v.fb.n} ute · ~${kr(v.fb.p50)}</span>` : '',

    t.gN ? `<span class="pill">${t.gN} sålda/30 d Blocket${t.s50 != null && t.gN >= 5 ? ' · ' + fdays(t.s50) : ''}</span>` : '',

  return `<div class="flip${open ? ' open' : ''}">

        <div class="meta">${pills}</div></div>

    </button>
    ${open ? flipDetail(t, v) : ''}</div>`;
}
function flipDetail(t, v) {
  loadTrend(t.k);

      ${t.tN ? row('<span class="src t">Tradera</span><br>sålda 30 d', t.tN, kr(t.t25), kr(t.t50), kr(t.t75), `${t.tW}/v`) : ''}
      ${v.fb ? row(`<span class="src f">FB</span><br>ute ${esc(FS.fb.checkedAt || '')}`, v.fb.n, kr(v.fb.p25), kr(v.fb.p50), kr(v.fb.p75), '') : ''}

    ${deals.length ? `<div class="lbl">Billiga just nu på Blocket</div><div class="listings">${deals.map(dealTile).join('')}</div>` : ''}
    <div class="row">${searchLinks(t.k)}</div></div>`;

function fairText(t) {
  const parts = [];
  if (t.src & 1) parts.push(`Tradera: minst hälften av ${t.tN} sålda senaste 30 dagarna gick för ${kr(t.tL)} eller mer (90 % säkert).`);
  if (t.src & 2) parts.push(`Blocket: minst hälften av ${t.gN} sålda gick för ${kr(t.gL)} eller mer (90 % säkert), räknat ner 10 % för annonser som togs bort osålda.`);

  return `<b>Rättvist pris ${kr(t.fair)}.</b> ${parts.join(' ')}${(t.src & 3) === 3 ? ' Det lägsta av dem används.' : ''}`;
}
function trendChart(s) {
  if (!s) return `<div class="muted small">Laddar trend…</div>`;
  if (s.length < 2) return `<div class="muted small">Trenden fylls på varje natt. ${s.length ? 'En dag hittills.' : ''}</div>`;
  const W = 520, H = 140, P = 30, days = s.map(r => r[0]), d0 = Math.min(...days), d1 = Math.max(...days);
  const prices = s.flatMap(r => [r[2], r[6]]).filter(x => x > 0), pMax = Math.max(1, ...prices) * 1.1;
  const x = d => P + (d - d0) / Math.max(1, d1 - d0) * (W - P - 8), y = p => H - 18 - p / pMax * (H - 30);
  const line = (i, col) => { const pts = s.filter(r => r[i] > 0).map(r => `${x(r[0]).toFixed(1)},${y(r[i]).toFixed(1)}`); return pts.length > 1 ? `<polyline fill="none" stroke="${col}" stroke-width="2" points="${pts.join(' ')}"/>` : ''; };
  const date = d => new Date(d * 864e5).toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Medianpris över tid">
    <text x="${P}" y="12">${kr(pMax / 1.1)}</text><text x="${P}" y="${H - 2}">${date(d0)}</text><text x="${W - 8}" y="${H - 2}" text-anchor="end">${date(d1)}</text>
    ${line(2, 'var(--blocket)')}${line(6, 'var(--tradera)')}${line(4, 'var(--good)')}</svg></div>
    <div class="muted small"><span style="color:var(--blocket)">■</span> Blocket utropspris · <span style="color:var(--good)">■</span> Blocket sålda · <span style="color:var(--tradera)">■</span> Tradera sålda (median per dag)</div>`;
}
function dealTile(d) {
  const t = FS.data._byK.get(d.k), v = t && flipVal(t, d.p);
  const age = FS.data.day - d.pubDay;
  return `<a class="listing" href="${esc(FS.data.urlBase + d.id)}" target="_blank" rel="noopener">${d.img ? imgTag(esc(d.img)) : '<div class="ph"></div>'}
    <div class="p"><span class="num">${kr(d.p)}</span>${v && v.vd ? `<span class="num" style="color:var(--good)">+${kr(v.vd.profit)}</span>` : ''}</div>
    <div class="t">${esc(d.t)}</div><div class="muted">${esc(d.loc)}${d.km >= 0 ? ' · ' + d.km + ' km' : ''} · ${age <= 0 ? 'i dag' : age + ' d'}</div></a>`;
}
function renderFlip() {
  const el = $('#v-flippa');
  if (!FS.data && !FS.loading && !FS.err) loadFlip();
  const d = FS.data;
  const modes = [['typer', 'Bästa fynd'], ['annonser', 'Billigt på Blocket'], ['sok', 'Sök allt']];
  const head = `<div class="panel"><div class="spread"><div><div class="lbl">Blocket + Tradera${d ? ' · uppdaterad ' + when(d.updatedAt) : ''}</div><h2>Flippa</h2></div>
      ${d && d.total && d.total.length ? (() => { const r = d.total[d.total.length - 1]; return `<div class="muted small num">${r[1].toLocaleString('sv-SE')} annonser på Blocket · ${r[2].toLocaleString('sv-SE')} sålda på Tradera (30 d)</div>`; })() : ''}</div>
    <div class="chips" role="group" aria-label="Visa">${modes.map(([k, l]) => `<button class="chip" data-flipmode="${k}" aria-pressed="${FS.mode === k}">${l}</button>`).join('')}</div>
    <div class="quick">
      <div class="field"><label for="flipQ">Filtrera</label><input id="flipQ" data-flipq="1" type="search" placeholder="t.ex. värmeelement, babolat" value="${esc(FS.q)}" autocomplete="off"></div>
      <div class="field"><label for="flipMax">Max inköp</label><input id="flipMax" data-flipmax="1" type="number" inputmode="numeric" min="0" step="50" value="${FS.max ?? ''}" placeholder="kr"></div>
    </div>
    ${FS.mode !== 'sok' ? `<label class="small" style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-flipall="1" ${FS.all ? 'checked' : ''}> Visa även uppskattade (för få sålda, bara utropspriser)</label>` : ''}
    <div class="muted small">${S.price != null ? `Räknar med att du köper för ${kr(S.price)} (Pris i butiken).` : 'Köppris = billigaste fjärdedelen på Blocket eller Facebook. Skriv ett pris under ”Pris i butiken” (Meny) för att räkna med det.'} Regel: ${ruleText()}.</div>
    <details class="how"><summary>Så räknar vi fram ett rättvist pris</summary>
      <p class="muted small">Priset bygger på <b>sålda</b> annonser, inte på vad folk begär: slutpriser på Tradera och annonser som försvunnit från Blocket. Det krävs minst 10 sålda.</p>
      <p class="muted small">Vi tar inte snittet utan en försiktig gräns: priset som minst hälften av försäljningarna nådde, med 90 % säkerhet. Med få sålda blir gränsen lägre, med många närmar den sig medianen.</p>
      <p class="muted small">En varutyp räknas bara om priserna inte spretar (dyraste fjärdedelen högst 3,5 gånger billigaste) och Tradera och Blocket är överens om nivån. Annars är det olika saker under samma namn.</p>
      <p class="muted small">Facebook Marketplace kollas för hand för de bästa kandidaterna (utropspriser, Stockholm). Det visar var du kan köpa billigt och om det redan är fullt av samma vara.</p>
      <p class="muted small">Kolla alltid modell, storlek och skick. Statistiken gäller varutypen, inte just ditt exemplar.</p></details></div>`;
  if (FS.loading && !d) { el.innerHTML = head + `<div class="note">Laddar…</div>`; return; }
  if (FS.err) { el.innerHTML = head + `<div class="note bad">Kunde inte läsa flipp-datan: ${esc(FS.err)}</div>`; return; }
  if (!d) { el.innerHTML = head + `<div class="note">Ingen gemensam databas än. Den byggs i nattens körning (Databas → Kör nu).</div>`; return; }
  const qn = norm(FS.q), max = FS.max ? +FS.max : null;
  const hit = k => !qn || norm(k).includes(qn);
  let body = '';
  if (FS.mode === 'annonser') {
    const list = d._deals.filter(x => (!max || x.p <= max) && (hit(x.k) || norm(x.t).includes(qn)))
      .map(x => { const t = d._byK.get(x.k), v = t && (FS.all || t.src !== 4) && flipVal(t, x.p); return { x, v }; }).filter(o => o.v && o.v.vd && o.v.vd.cls === 'buy')
      .sort((a, b) => b.v.vd.profit - a.v.vd.profit);
    body = list.length ? `<div class="listings">${list.slice(0, FS.limit).map(o => dealTile(o.x)).join('')}</div>${list.length > FS.limit ? `<button class="btn" data-flipmore="1">Visa fler (${list.length - FS.limit})</button>` : ''}`
      : `<div class="note">Inga annonser under ${max ? kr(max) : 'gränsen'} som klarar regeln just nu.</div>`;
    body = `<div class="muted small">Annonser från privatpersoner, upplagda senaste 3 veckorna, som ligger långt under vad samma sorts vara brukar säljas för. Kolla alltid skick och att det är samma modell.</div>` + body;
  } else {
    let src;
    if (FS.mode === 'sok') { loadAllTerms(); src = FS.terms || []; if (!qn) { el.innerHTML = head + `<div class="note">Skriv ett ord ovan för att se hur det går på Blocket och Tradera.${FS.termsLoading ? ' Laddar…' : ''}</div>`; return; } }
    else src = d._terms.filter(t => !t.cov && t.fair > 0 && (FS.all || t.src !== 4));
    const list = src.filter(t => hit(t.k)).map(t => ({ t, v: flipVal(t) })).filter(o => o.v && (FS.mode === 'sok' || (o.v.vd && o.v.vd.cls === 'buy' && (!max || o.v.buy <= max))))
      .sort((a, b) => FS.mode === 'sok' ? (b.t.bN + b.t.tN) - (a.t.bN + a.t.tN) : b.v.score - a.v.score);
    body = list.length ? list.slice(0, FS.limit).map(o => flipCard(o.t)).join('') + (list.length > FS.limit ? `<button class="btn" data-flipmore="1">Visa fler (${list.length - FS.limit})</button>` : '')
      : `<div class="note">${FS.termsLoading ? 'Laddar…' : FS.mode === 'sok' ? 'Inget ord med tillräckligt mycket data.' : 'Inga varutyper klarar regeln med de här filtren.'}</div>`;
  }
  el.innerHTML = head + `<div class="flips">${body}</div>
    <div class="note small">Facebook Marketplace ingår inte: Meta blockerar automatisk hämtning. Jämför manuellt med ”FB Marketplace ↗”.</div>`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-flipopen],[data-flipmode],[data-flipmore]'); if (!t) return;
  if (t.dataset.flipopen) { FS.open = FS.open === t.dataset.flipopen ? null : t.dataset.flipopen; render(); return; }
  if (t.dataset.flipmode) { FS.mode = t.dataset.flipmode; FS.limit = 40; store.set('tk-flipmode', FS.mode); render(); return; }
  if (t.dataset.flipmore) { FS.limit += 40; render(); }
});
let fTimer;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.flipq) { clearTimeout(fTimer); fTimer = setTimeout(() => { FS.q = el.value.trim(); FS.limit = 40; render(); }, 250); }
  if (el.dataset.flipmax) { clearTimeout(fTimer); fTimer = setTimeout(() => { FS.max = el.value === '' ? null : Math.max(0, +el.value); store.set('tk-flipmax', FS.max); FS.limit = 40; render(); }, 400); }
});
document.addEventListener('change', e => { if (e.target.dataset.flipall) { FS.all = e.target.checked; store.set('tk-flipall', FS.all); render(); } });

// ---------- vy: Hype (nya saker som säljs över nypris) ----------
// data/hype.json (main): bevakade varor med nypris, varför och risker. hype/hype.json (grenen db): nattens sålda priser
// för oanvända exemplar på Tradera, utropspriser på Blocket och listan "Hett just nu" som hittas automatiskt.
const HS = { cfg: null, db: null, loading: false, err: null, view: store.get('tk-hypeview', 'bevakade'), cat: 'Alla', open: null, form: false };
async function loadHype(force) {
  if ((HS.cfg || HS.loading) && !force) return;
  HS.loading = true;
  try { [HS.cfg, HS.db] = await Promise.all([readRepoJson('data/hype.json'), readDbFile('hype/hype.json').catch(() => null)]); HS.err = null; }
  catch (e) { HS.err = e.message; }
  HS.loading = false; render();
}
function hypeVal(it) {
  const d = HS.db && HS.db.items ? HS.db.items.find(x => x.id === it.id) : null;
  const t = d && d.t, b = d && d.b;
  const sold = t && t.n >= 3 ? t.med : null;
  const buy = it.bw && it.bw.price ? it.bw.price : it.retail;
  if (sold == null || !buy) return { d, t, b, sold, buy, vd: null };
  const net = sold - fee('tradera', sold) - extraCost();
  return { d, t, b, sold, buy, net, vd: verdict({ net, max: maxBuy(net) }, buy) };
}
function hypeSpark(hist) {
  const h = (hist || []).filter(r => r[1] > 0); if (h.length < 2) return '';
  const w = 120, H = 28, mx = Math.max(...h.map(r => r[1])), mn = Math.min(...h.map(r => r[1])), span = Math.max(1, mx - mn);
  const pts = h.map((r, i) => `${(i / (h.length - 1) * w).toFixed(1)},${(H - 3 - (r[1] - mn) / span * (H - 6)).toFixed(1)}`).join(' ');
  const up = h[h.length - 1][1] >= h[0][1];
  return `<span class="row small muted"><svg width="${w}" height="${H}" viewBox="0 0 ${w} ${H}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--${up ? 'good' : 'bad'})" stroke-width="2"/></svg>${up ? 'stiger' : 'faller'} senaste ${h.length} dagarna</span>`;
}
// Begränsad: säljs bara till ett visst datum (pensioneras, Black Friday, säsong) eller i begränsad upplaga.
const daysTo = iso => iso ? Math.ceil((new Date(iso + 'T23:59:59') - Date.now()) / 864e5) : null;
function limPill(it) {
  const l = it.limited; if (!l) return '';
  const d = daysTo(l.until);
  const when = l.until ? (d < 0 ? ' · slut' : d === 0 ? ' · sista dagen' : ` · ${d} d kvar`) : '';
  return `<span class="pill lim" title="${esc(l.note || '')}">${/^begränsad/i.test(l.kind) ? esc(l.kind) : 'Begränsad · ' + esc(l.kind)}${when}</span>`;
}
function bwPill(it) {
  const w = it.bw; if (!w || !w.list || w.price >= w.list) return '';
  return `<span class="pill bw">Black Week −${Math.round((1 - w.price / w.list) * 100)} %</span>`;
}
function hypeCard(it) {
  const v = hypeVal(it), open = HS.open === it.id;
  const profit = v.vd ? `<div class="flip-profit ${v.vd.cls} num">${v.vd.profit >= 0 ? '+' : ''}${kr(v.vd.profit)}</div>` : `<div class="flip-profit num">${v.sold ? '' : '–'}</div>`;
  const bwOk = it.bw && it.bw.list && it.bw.price < it.bw.list;
  const line = `${it.bw && it.bw.price ? `${bwOk ? 'Köp' : 'Nu billigast'} <b>${kr(it.bw.price)}</b> <span>(${[esc(it.bw.store), it.bw.list ? 'ord. ' + kr(it.bw.list) : ''].filter(Boolean).join(', ')})</span>` : it.retail ? `Nypris ${it.approx ? 'ca ' : ''}<b>${kr(it.retail)}</b>` : 'Nypris varierar'} → ${v.sold ? `säljs för <b>${kr(v.sold)}</b> <span>(${v.t.n} sålda oanvända på Tradera)</span>` : '<span>inga sålda oanvända på Tradera än</span>'}`;
  let body = '';
  if (open) {
    const list = v.d && v.d.list ? v.d.list : [];
    body = `<div class="flip-body">
      <p class="small">${esc(it.why)}</p>
      ${it.limited ? `<div class="note small"><b>Begränsad (${esc(it.limited.kind)}${it.limited.until ? ', till ' + esc(it.limited.until) : ''}):</b> ${esc(it.limited.note || '')}</div>` : ''}
      ${it.bw ? `<div class="note small"><b>Black Week-koll ${esc(it.bw.checked || '')}:</b> billigast ${kr(it.bw.price)}${it.bw.store ? ' hos ' + esc(it.bw.store) : ''}${it.bw.list ? `, ordinarie ${kr(it.bw.list)}` : ''}. ${esc(it.bw.note || '')} ${it.bw.u ? `<a href="${esc(it.bw.u)}" target="_blank" rel="noopener">Se alla butiker ↗</a>` : ''}</div>` : ''}
      <div class="note warn small"><b>Risk:</b> ${esc(it.risk)}</div>
      <div class="kv">
        <div><span>Tradera, sålda oanvända</span><b>${v.t ? kr(v.t.med) : '–'}</b><span>${v.t ? `${v.t.n} st · ${kr(v.t.p25)}–${kr(v.t.p75)}` : 'ingen data'}</span></div>
        <div><span>Blocket, till salu nu</span><b>${v.b ? kr(v.b.med) : '–'}</b><span>${v.b ? `${v.b.n} st · utropspris` : 'ingen data'}</span></div>
        <div><span>Du får ut efter avgift</span><b>${v.net != null ? kr(v.net) : '–'}</b><span>Tradera ${S.cfg.traderaPct} %${S.cfg.packCost ? ' + förpackning' : ''}</span></div>
        <div><span>Multipel</span><b>${v.vd && isFinite(v.vd.mult) ? 'x' + v.vd.mult.toFixed(2).replace('.', ',') : '–'}</b><span>${v.vd ? v.vd.label : ''}</span></div>
      </div>
      ${v.d ? hypeSpark(v.d.hist) : ''}
      ${list.length ? `<div class="listings">${list.map(([s, t, p, img, u]) => { const su = safeUrl(u), si = safeImg(img); return `<a class="listing" ${su ? `href="${su}" target="_blank" rel="noopener"` : ''}>${si ? imgTag(si) : '<div class="ph"></div>'}<div class="p"><span class="src ${s}">${s === 't' ? 'Såld' : 'Blocket'}</span><span class="num">${kr(p)}</span></div><div class="t muted">${esc(t)}</div></a>`; }).join('')}</div>` : ''}
      <div class="row">${(it.where || []).map(w => `<a class="btn small" href="${esc(w.u)}" target="_blank" rel="noopener">Köp: ${esc(w.t)} ↗</a>`).join('')}${searchLinks(it.q)}</div>
      ${(it.src || []).length ? `<div class="src-list muted">Källor: ${it.src.map(x => `<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t)}</a>`).join('')}</div>` : ''}
    </div>`;
  }
  return `<div class="flip${open ? ' open' : ''}">
    <button class="flip-head" data-hypeopen="${esc(it.id)}" aria-expanded="${open}">
      <div class="flip-main"><div class="flip-name" style="text-transform:none">${esc(it.name)}</div>
        <div class="hype-line">${line}</div>
        <div class="meta">${limPill(it)}${bwPill(it)}<span class="pill">${esc(it.cat)}</span>${it.status ? `<span class="pill ${/slut|brist|pensioneras|släpps/i.test(it.status) ? 'mid' : /svalnar/i.test(it.status) ? 'slow' : ''}">${esc(it.status)}${it.date && /släpps|pensioneras/i.test(it.status) ? '' : ''}</span>` : ''}</div></div>
      ${profit}
    </button>${body}</div>`;
}
function hotHTML() {

    ${limNote}<div class="muted small">${limView ? '' : 'Sorterat på vinst efter Tradera-avgift om du köper till nypris (eller Black Week-pris) och säljer oanvänt. '} Regel: ${ruleText()}. Nypriser är ungefärliga, kolla butiken.</div>
    <div class="flips">${list.map(o => hypeCard(o.i)).join('')}</div>${tips}`;

// ---------- konto ----------
// Nyckeln krypteras på enheten med ditt lösenord (PBKDF2 + AES-GCM) och bara den krypterade versionen sparas i repot.
// På en ny enhet hämtas den krypterade filen och låses upp med lösenordet. Lösenordet lämnar aldrig enheten.
const AUTH_PATH = 'data/konto.json', KDF_ITER = 600000;
const bytesToB64 = u8 => { let s = ''; u8.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const b64ToBytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function sealToken(token, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt, KDF_ITER);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(token)));
  return { v: 1, kdf: 'PBKDF2-SHA256', iter: KDF_ITER, cipher: 'AES-GCM-256', salt: bytesToB64(salt), iv: bytesToB64(iv), ct: bytesToB64(ct), savedAt: new Date().toISOString() };
}
async function openToken(blob, pass) {
  const key = await deriveKey(pass, b64ToBytes(blob.salt), blob.iter);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(blob.iv) }, key, b64ToBytes(blob.ct)));
}
