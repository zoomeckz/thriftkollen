<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161A20">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thriftkollen">
<title>Thriftkollen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: mobile-first app. Sticky snabbkoll-bar högst upp, flikar under, kortrutnät som blir en kolumn på mobil.
   Prislappen (gul, med hål) är signaturdetaljen: det är maxpriset du får betala i butiken. */
/* Alltid mörkt tema, oavsett telefonens inställning. */
:root {
  --bg: #0E1115; --surface: #161A20; --surface-2: #1E242C; --ink: #E8ECF1; --muted: #98A2AF; --line: #2A313B;
  --accent: #7EA0FF; --accent-ink: #0B1020; --tag: #F2C52E; --tag-ink: #221A00;
  --good: #4CC583; --good-bg: #12301F; --warn: #E6B055; --warn-bg: #33270F; --bad: #F2766E; --bad-bg: #3A1816;
  --tradera: #F2C52E; --blocket: #7EA0FF;
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }

/* Toppmenyn: en smal list som alltid syns. Menyn fälls ut över innehållet i stället för att trycka ner det. */
header.top { position: fixed; top: 0; left: 0; right: 0; z-index: 15; padding-top: env(safe-area-inset-top, 0px); background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar { display: flex; align-items: center; gap: 10px; height: 56px; }
.logo { margin: 0; flex: 0 0 auto; font-family: var(--font-display); font-weight: 800; font-stretch: 80%; font-size: 1.35rem; letter-spacing: -0.01em; text-transform: uppercase; line-height: 1; }
.logo span { background: var(--tag); color: var(--tag-ink); padding: 0 .25em; margin-left: .08em; }
.bar-info { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px; overflow: hidden; background: none; border: 0; padding: 6px 0; cursor: pointer; text-align: left; font-weight: 600; color: var(--muted); white-space: nowrap; }
.bar-info #tabName { overflow: hidden; text-overflow: ellipsis; }
.price-chip { background: var(--tag); color: var(--tag-ink); }
.menu-btn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; cursor: pointer; }
.burger { display: grid; gap: 3px; width: 16px; }
.burger i { display: block; height: 2px; border-radius: 2px; background: currentColor; transition: transform .2s, opacity .2s; }
.menu-btn[aria-expanded="true"] .burger i:nth-child(1) { transform: translateY(5px) rotate(45deg); }
.menu-btn[aria-expanded="true"] .burger i:nth-child(2) { opacity: 0; }
.menu-btn[aria-expanded="true"] .burger i:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }
.drawer { position: absolute; left: 0; right: 0; top: 100%; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: 0 18px 40px rgb(0 0 0 / .28); max-height: calc(100vh - 80px); overflow-y: auto; }
.drawer-in { display: grid; gap: 14px; padding-block: 14px 16px; }
.quick { display: grid; grid-template-columns: minmax(0, 1fr) 9.5rem; gap: 10px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
input[type=text], input[type=number], input[type=search], input[type=date], input[type=password], select, textarea {
  width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 16px;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
nav.tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; }
nav.tabs a { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 10px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: .95rem; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
nav.tabs a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
nav.tabs a .dot { display: inline-block; min-width: 1.4em; padding: 0 .35em; border-radius: 999px; background: var(--tag); color: var(--tag-ink); font-size: .72rem; text-align: center; }

main { padding-top: calc(56px + env(safe-area-inset-top, 0px) + 22px); padding-bottom: 72px; }
section[data-view] { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
h2 { font-family: var(--font-display); font-stretch: 85%; font-weight: 800; font-size: 1.35rem; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-stretch: 90%; font-weight: 700; font-size: 1.05rem; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spread { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.spread > * { min-width: 0; max-width: 100%; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { padding: 16px 20px; font-size: 1.05rem; width: 100%; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 6px 10px; font-size: .85rem; }
.btn[disabled] { opacity: .5; cursor: default; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chip { flex: 0 0 auto; padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: .88rem; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 18px; display: grid; gap: 16px; min-width: 0; }
.note { padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); font-size: .92rem; }
.note.warn { background: var(--warn-bg); }
.note.bad { background: var(--bad-bg); color: var(--bad); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; grid-template-rows: auto 1fr; cursor: pointer; text-align: left; padding: 0; position: relative; }
.card:hover { border-color: var(--muted); }
.thumbs { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 2px; aspect-ratio: 16 / 9; background: var(--surface-2); max-width: 100%; overflow: hidden; }
.thumbs img { width: 100%; height: 100%; min-height: 0; object-fit: cover; display: block; }
.thumbs img:first-child { grid-row: 1 / 3; }
.thumbs .ph { display: grid; place-items: center; color: var(--muted); font-size: .8rem; grid-column: 1 / -1; grid-row: 1 / -1; }
.card .body { padding: 14px 16px 16px; display: grid; gap: 10px; align-content: start; }
.card .name { font-family: var(--font-display); font-weight: 700; font-stretch: 88%; font-size: 1.12rem; line-height: 1.15; text-transform: capitalize; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: .78rem; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: .75rem; }
.pill.fast { background: var(--good-bg); color: var(--good); }
.pill.mid { background: var(--warn-bg); color: var(--warn); }
.pill.slow { background: var(--bad-bg); color: var(--bad); }
.prices { display: flex; align-items: end; justify-content: space-between; gap: 8px; }
.sells { display: grid; font-size: .8rem; color: var(--muted); }
.sells b { font-family: var(--font-display); font-size: 1.15rem; color: var(--ink); font-stretch: 90%; }

.tag { position: relative; display: inline-grid; padding: 5px 12px 5px 22px; background: var(--tag); color: var(--tag-ink);
  clip-path: polygon(12px 0, 100% 0, 100% 100%, 12px 100%, 0 50%); border-radius: 0 6px 6px 0; line-height: 1.05; text-align: right; }
.tag::before { content: ""; position: absolute; left: 9px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--surface); }
.tag small { font-size: .62rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.tag b { font-family: var(--font-display); font-weight: 800; font-stretch: 80%; font-size: 1.45rem; font-variant-numeric: tabular-nums; }
.tag.none { background: var(--surface-2); color: var(--muted); }
.tag.big b { font-size: 2.2rem; }

.verdict { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; font-weight: 700; font-size: .9rem; }
.verdict.buy { background: var(--good-bg); color: var(--good); }
.verdict.maybe { background: var(--warn-bg); color: var(--warn); }
.verdict.skip { background: var(--bad-bg); color: var(--bad); }
.verdict span { font-weight: 500; font-size: .82rem; }

.sheet-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 20; display: grid; align-items: end; justify-items: center; }
.sheet { background: var(--bg); width: min(860px, 100%); max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0;
  padding-block: 16px calc(24px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
@media (min-width: 760px) { .sheet-bg { align-items: center; } .sheet { border-radius: 16px; } }
.sheet-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.sheet-head h2 { text-transform: capitalize; font-size: 1.6rem; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kv > div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.kv b { font-family: var(--font-display); font-size: 1.3rem; font-stretch: 88%; font-variant-numeric: tabular-nums; }
.kv span { font-size: .78rem; color: var(--muted); }
.listings { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.listing { display: grid; gap: 4px; text-decoration: none; color: var(--ink); font-size: .82rem; min-width: 0; }
.listing img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--surface-2); }
.listing .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.listing .p { display: flex; justify-content: space-between; font-weight: 700; }
.src { font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.src.t { color: var(--tradera); } .src.b { color: var(--blocket); }
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; width: 100%; min-width: 520px; height: auto; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; }

.table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.table th, .table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table th { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.table td.r, .table th.r { text-align: right; font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; }
.tile b { font-family: var(--font-display); font-weight: 800; font-stretch: 82%; font-size: 1.7rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile span { font-size: .78rem; color: var(--muted); }
.pos { color: var(--good); } .neg { color: var(--bad); }
.inv { display: grid; gap: 8px; }
.inv-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; }
.inv-item .controls { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.inv-item .title { font-weight: 600; text-transform: capitalize; }
.bar { height: 10px; border-radius: 3px; background: var(--accent); }
.barrow { display: grid; grid-template-columns: minmax(90px, 9rem) minmax(0, 1fr) 5.5rem; gap: 10px; align-items: center; font-size: .88rem; }
.barrow .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: capitalize; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: .88em; overflow-wrap: anywhere; }
.empty { text-align: center; padding: 32px 16px; display: grid; gap: 10px; justify-items: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 30; font-weight: 600; font-size: .9rem; max-width: calc(100% - 32px); }

/* Foto */
.shot { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; align-items: start; }
.shot img.photo { width: 120px; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--surface-2); }
.filters > summary { cursor: pointer; list-style: none; padding: 10px 0 2px; }
.filters > summary::-webkit-details-marker { display: none; }
.filters > summary::after { content: " ▾"; color: var(--muted); }
.filters[open] > summary::after { content: " ▴"; }
.filter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px 12px; margin-top: 12px; }
@media (max-width: 480px) { .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.photo-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.batch { display: grid; gap: 10px; }
.batch-item { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 12px; align-items: end; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.batch-item img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
details.panel > summary { cursor: pointer; list-style: none; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: " ▾"; color: var(--muted); }
details.panel[open] > summary::after { content: " ▴"; }
.login input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.preview { width: 100%; max-height: 320px; object-fit: contain; border-radius: 8px; background: var(--surface-2); }
.fynd { display: grid; gap: 12px; }
.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.cmp { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; cursor: pointer; background: var(--bg); text-align: left; }
.cmp:hover { border-color: var(--muted); }
.cmp .mini { display: flex; gap: 4px; overflow: hidden; }
.cmp .mini img { width: 54px; height: 54px; object-fit: cover; border-radius: 6px; flex: 0 0 auto; }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 480px) {
  .quick { grid-template-columns: minmax(0, 1fr) 7.5rem; }
  .menu-btn #menuLabel { display: none; }
  .menu-btn { padding: 10px 12px; }
  .panel { padding: 18px 16px; }
  .sheet-head h2 { font-size: 1.4rem; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .card { grid-template-columns: 118px minmax(0, 1fr); grid-template-rows: none; }
  .card .thumbs { aspect-ratio: auto; height: 100%; min-height: 136px; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  .card .thumbs img:not(:first-child) { display: none; }
  .card .thumbs img:first-child { grid-row: auto; }
  .card .verdict { grid-column: 1 / -1; }
  .tag b { font-size: 1.25rem; }
  .shot { grid-template-columns: 84px minmax(0, 1fr); }
  .shot img.photo { width: 84px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top" id="top">
  <div class="wrap topbar">
    <h1 class="logo">Thrift<span>kollen</span></h1>
    <button class="bar-info" id="barInfo" type="button" aria-label="Öppna menyn">
      <span id="tabName">Katalog</span>
      <span class="pill" id="queryChip" hidden></span>
      <span class="pill price-chip" id="priceChip" hidden></span>
    </button>
    <button class="menu-btn" id="menuToggle" type="button" aria-expanded="false" aria-controls="drawer">
      <span class="burger" aria-hidden="true"><i></i><i></i><i></i></span><span id="menuLabel">Meny</span>
    </button>
  </div>
  <div class="drawer" id="drawer" hidden>
    <div class="wrap drawer-in">
      <div class="quick">
        <div class="field">
          <label for="q">Vad hittade du?</label>
          <input id="q" type="search" placeholder="t.ex. mon amie, game boy, kånken" autocomplete="off" enterkeyhint="search">
        </div>
        <div class="field">
          <label for="price">Pris i butiken</label>
          <input id="price" type="number" inputmode="numeric" min="0" step="5" placeholder="kr">
        </div>
      </div>
      <nav class="tabs" aria-label="Vyer">
        <a href="#fynd" data-tab="fynd">Katalog</a>
        <a href="#foto" data-tab="foto">Fota<span class="dot" id="pendingDot" hidden></span></a>
        <a href="#lager" data-tab="lager">Lager</a>
        <a href="#databas" data-tab="databas">Databas</a>
        <a href="#statistik" data-tab="statistik">Statistik</a>
        <a href="#installningar" data-tab="installningar">Inställningar</a>
      </nav>
      <small class="muted" id="status">Laddar…</small>
    </div>
  </div>
</header>

<main class="wrap">
  <section data-view="fynd" id="v-fynd"></section>
  <section data-view="foto" id="v-foto" hidden></section>
  <section data-view="lager" id="v-lager" hidden></section>
  <section data-view="statistik" id="v-statistik" hidden></section>
  <section data-view="databas" id="v-databas" hidden></section>
  <section data-view="installningar" id="v-installningar" hidden></section>
</main>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>
<input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
<input id="photoPick" type="file" accept="image/*" multiple hidden>
<input id="invImport" type="file" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';
const CATS = ['Möbler & stolar', 'Porslin & glas', 'Elektronik & retro', 'Kläder & märken', 'Barn & fritid', 'Övrigt'];
const DEFAULT_CFG = { minProfit: 100, minMult: 2, mode: 'any', valuation: 'bal', platform: 'tradera',
  traderaPct: 10, traderaMin: 3, traderaCap: 200, blocketFee: 0, haggle: 20 };
const TABS = ['fynd', 'foto', 'lager', 'databas', 'statistik', 'installningar'];

// ---------- lagring på enheten ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function guessRepo() {
  const h = location.hostname;
  if (h.endsWith('.github.io')) { const owner = h.split('.')[0]; const repo = location.pathname.split('/').filter(Boolean)[0] || `${owner}.github.io`; return { owner, repo }; }
  return { owner: '', repo: 'thriftkollen' };
}
// Nyckeln: localStorage om "kom ihåg mig", annars sessionStorage (glöms när fliken stängs).
const tokenStore = {
  get() { try { return localStorage.getItem('tk-token') || sessionStorage.getItem('tk-token') || ''; } catch { return ''; } },
  set(t, remember) { try { localStorage.removeItem('tk-token'); sessionStorage.removeItem('tk-token'); if (t) (remember ? localStorage : sessionStorage).setItem('tk-token', t); } catch {} },

// ---------- GitHub ----------
async function api(path, opts = {}) {
  const headers = { 'Accept': opts.accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (gh.token) headers.Authorization = `Bearer ${gh.token}`;
  if (opts.body) headers['Content-Type'] = 'application/json';
  const r = await fetch(`https://api.github.com${path}`, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: 'no-store' });
  if (!r.ok) {
    let msg = `${r.status}`; try { msg += ' ' + (await r.json()).message; } catch {}
    const e = new Error(msg); e.status = r.status; throw e;
  }
  return r.status === 204 ? null : (opts.accept && opts.accept.includes('raw') ? r.text() : r.json());
}
const repoPath = p => `/repos/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}${p}`;
async function readRepoJson(path) {
  if (gh.token && gh.owner) {
    try { return JSON.parse(await api(repoPath(`/contents/${path}?ref=${gh.branch}`), { accept: 'application/vnd.github.raw+json' })); } catch (e) { if (e.status === 404) return null; }
  }
  let r = null;
  if (gh.owner) { try { r = await fetch(rawUrl(path), { cache: 'no-store' }); if (!r.ok && r.status !== 404) r = null; } catch { r = null; } }
  if (!r) r = await fetch(`./${path}?t=${Date.now()}`, { cache: 'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function putFile(path, contentB64, message, sha) {
  return api(repoPath(`/contents/${path}`), { method: 'PUT', body: { message, content: contentB64, branch: gh.branch, ...(sha ? { sha } : {}) } });
}
async function updateRepoJson(path, mutate, message) {
  for (let attempt = 0; attempt < 3; attempt++) {
    const cur = await api(repoPath(`/contents/${path}?ref=${gh.branch}`));
    const data = JSON.parse(fromB64(cur.content));
    const next = mutate(data);
    try { return await putFile(path, b64(JSON.stringify(next, null, 1)), message, cur.sha); }
    catch (e) { if (e.status !== 409) throw e; }
  }
  throw new Error('Filen ändrades samtidigt. Försök igen.');
}

}

}

}

async function loadData(quiet) {

    const [td, fy] = await Promise.all([readRepoJson('data/thriftdata.json'), readRepoJson('data/fynd.json')]);
    if (td) { S.terms = new Map((td.terms || []).map(t => [t.id, t])); S.meta = { generatedAt: td.generatedAt }; }
    S.fynd = (fy && fy.items) || [];
    const doneAt = new Map(S.fynd.map(f => [f.id, f.processedAt || '']));
    const before = S.pending.length;
    S.pending = S.pending.filter(p => !(doneAt.has(p.id) && doneAt.get(p.id) >= p.createdAt) && daysAgo(p.createdAt) < 1);

// ---------- ekonomi ----------
function fee(platform, price) {
  const c = S.cfg;
  if (platform === 'tradera') return Math.min(c.traderaCap, Math.max(c.traderaMin, price * c.traderaPct / 100));
  if (platform === 'blocket') return c.blocketFee;
  return 0;
}
function valuation(t) {
  if (!t) return null;
  const T = t.tradera && t.tradera.stats, B = t.blocket && t.blocket.stats;
  const tv = T && T.n >= 3 ? T.med : null;
  const bv = B && B.n >= 3 ? B.med * (1 - S.cfg.haggle / 100) : null;
  const vals = [tv, bv].filter(v => v != null);
  if (!vals.length) return null;
  let resale;
  if (S.cfg.valuation === 'safe') resale = tv ?? bv;
  else if (S.cfg.valuation === 'opt') resale = Math.max(...vals);
  else resale = vals.reduce((a, b) => a + b, 0) / vals.length;
  const net = resale - fee(S.cfg.platform, resale);
  return { resale, net, tv, bv, max: maxBuy(net) };
}
function maxBuy(net) {
  const a = net - S.cfg.minProfit, b = net / S.cfg.minMult;

  return v >= 5 ? Math.floor(v / 5) * 5 : 0;
}
function verdict(v, price) {

  const okP = profit >= S.cfg.minProfit, okM = mult >= S.cfg.minMult;
  const ok = S.cfg.mode === 'all' ? okP && okM : okP || okM;
  const cls = ok ? 'buy' : (profit > 0 && price <= v.max * 1.25 + 10 ? 'maybe' : 'skip');
  return { cls, label: cls === 'buy' ? 'Köp' : cls === 'maybe' ? 'Kanske, pruta' : 'Skippa', profit, mult };
}

  const a = B.ageMed;

  if (a <= 45) return { cls: 'mid', label: 'Medeltakt', rank: a };

}

function matches(t, q) {
  if (!q) return 1;
  const hay = norm(t.q + ' ' + (t.must || '') + ' ' + t.cat);
  const qt = norm(q).split(' ').filter(Boolean);
  let score = 0;
  for (const w of qt) { if (hay.includes(w)) score += 2; else if (w.length >= 4 && hay.split(' ').some(h => h.startsWith(w.slice(0, 4)))) score += 1; }
  const mustT = norm(t.must && t.must !== '*' ? t.must : t.q).split(' ').filter(w => w.length >= 2);
  if (mustT.length && mustT.every(m => norm(q).includes(m))) score += 3;
  return score >= Math.max(2, qt.length) ? score : 0;
}

function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; }

async function prepPhoto(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => null);
  const img = bmp || await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const w = img.width, h = img.height, scale = Math.min(1, 1024 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * scale); c.height = Math.round(h * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const t = document.createElement('canvas'), s = 160 / Math.max(c.width, c.height); t.width = Math.round(c.width * s); t.height = Math.round(c.height * s);
  t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
  return { url: c.toDataURL('image/jpeg', 0.82), thumb: t.toDataURL('image/jpeg', 0.7), text: '' };
}
async function onPhotosChosen(files) {

// Lägger upp flera filer i en enda commit (Git Data API), så att GitHub bara startar en körning för hela omgången.
async function commitFiles(files, message) {
  for (const f of files) if (!f.blob) f.blob = (await api(repoPath('/git/blobs'), { method: 'POST', body: { content: f.b64, encoding: 'base64' } })).sha;
  for (let attempt = 0; attempt < 4; attempt++) {
    const ref = await api(repoPath(`/git/ref/heads/${gh.branch}`));
    const base = await api(repoPath(`/git/commits/${ref.object.sha}`));
    const tree = await api(repoPath('/git/trees'), { method: 'POST', body: { base_tree: base.tree.sha, tree: files.map(f => ({ path: f.path, mode: '100644', type: 'blob', sha: f.blob })) } });
    const commit = await api(repoPath('/git/commits'), { method: 'POST', body: { message, tree: tree.sha, parents: [ref.object.sha] } });
    try { await api(repoPath(`/git/refs/heads/${gh.branch}`), { method: 'PATCH', body: { sha: commit.sha, force: false } }); return commit; }
    catch (e) { if (e.status !== 422 && e.status !== 409) throw e; }
  }
  throw new Error('Repot ändrades samtidigt. Försök igen.');
}
async function sendPhotos() {
  const ps = S.photos; if (!ps.length) return;
  S.photoCat = $('#photoCat').value;
  S.uploading = true; render();
  try {
    const stamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
    const files = [], jobs = [];
    ps.forEach((p, i) => {
      const id = `${stamp}-${Math.random().toString(36).slice(2, 6)}${i}`;
      const job = { id, createdAt: new Date().toISOString(), text: p.text.trim(), cat: S.photoCat, image: `uploads/${id}.jpg` };
      files.push({ path: job.image, b64: p.url.split(',')[1] }, { path: `queue/${id}.json`, b64: b64(JSON.stringify(job)) });
      jobs.push({ id, createdAt: job.createdAt, text: job.text, thumb: p.thumb });
    });
    const texts = jobs.map(j => j.text).filter(Boolean);
    await commitFiles(files, `Scrapa ${jobs.length} ${jobs.length === 1 ? 'foto' : 'foton'}${texts.length ? ': ' + texts.slice(0, 3).join(', ') : ''}`);
    S.pending = [...jobs, ...S.pending]; store.set('tk-pending', S.pending);
    S.photos = []; toast(`${jobs.length} ${jobs.length === 1 ? 'foto' : 'foton'} skickade. Scrapen startar på GitHub.`);
    schedulePoll();
  } catch (e) {
    toast(e.status === 401 || e.status === 403 ? 'GitHub nekade. Logga in igen under Inställningar.' : 'Kunde inte skicka: ' + e.message);
  } finally { S.uploading = false; render(); }
}

// ---------- konto ----------
// Nyckeln krypteras på enheten med ditt lösenord (PBKDF2 + AES-GCM) och bara den krypterade versionen sparas i repot.
// På en ny enhet hämtas den krypterade filen och låses upp med lösenordet. Lösenordet lämnar aldrig enheten.
const AUTH_PATH = 'data/konto.json', KDF_ITER = 600000;
const bytesToB64 = u8 => { let s = ''; u8.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const b64ToBytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function sealToken(token, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt, KDF_ITER);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(token)));
  return { v: 1, kdf: 'PBKDF2-SHA256', iter: KDF_ITER, cipher: 'AES-GCM-256', salt: bytesToB64(salt), iv: bytesToB64(iv), ct: bytesToB64(ct), savedAt: new Date().toISOString() };
}
async function openToken(blob, pass) {
  const key = await deriveKey(pass, b64ToBytes(blob.salt), blob.iter);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(blob.iv) }, key, b64ToBytes(blob.ct)));
}
async function loadAuth() { try { S.auth = await readRepoJson(AUTH_PATH); } catch { S.auth = null; } render(); }

// ---------- render ----------
const TAB_NAMES = { fynd: 'Katalog', foto: 'Fota', lager: 'Lager', databas: 'Databas', statistik: 'Statistik', installningar: 'Inställningar' };
function setMenu(open) {
  S.menuOpen = open; store.set('tk-menu', open);
  $('#drawer').hidden = !open;
  const b = $('#menuToggle'); b.setAttribute('aria-expanded', String(open)); $('#menuLabel').textContent = open ? 'Stäng' : 'Meny';
}
function render() {
  $('#tabName').textContent = TAB_NAMES[S.tab] + (S.pending.length ? ` · ${S.pending.length} scrapas` : '');
  const pc = $('#priceChip'); pc.hidden = S.price == null; pc.textContent = S.price != null ? kr(S.price) : '';
  const qc = $('#queryChip'); qc.hidden = !S.q; qc.textContent = S.q ? `”${S.q}”` : '';
  const st = $('#status');
  st.textContent = S.state === 'loading' ? 'Laddar…' : S.state === 'error' ? 'Kunde inte läsa data' : `${S.terms.size} sökord${S.meta && S.meta.generatedAt ? ' · data ' + when(S.meta.generatedAt) : ''}`;
  const dot = $('#pendingDot'); dot.hidden = !S.pending.length; dot.textContent = S.pending.length;
  document.querySelectorAll('nav.tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.tab === S.tab ? 'page' : 'false'));
  document.querySelectorAll('section[data-view]').forEach(s => { s.hidden = s.dataset.view !== S.tab; if (s.hidden) s.innerHTML = ''; });
  const active = document.activeElement && document.activeElement.id;
  ({ fynd: renderFynd, foto: renderFoto, lager: renderLager, databas: renderDatabas, statistik: renderStats, installningar: renderSettings })[S.tab]();
  renderSheet();
  if (active && !['q', 'price'].includes(active)) { const e = document.getElementById(active); if (e && e.focus) { e.focus(); try { const n = e.value.length; e.setSelectionRange(n, n); } catch {} } }
}

// ---------- händelser ----------
let qTimer;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.q = e.target.value.trim(); if (S.tab !== 'fynd') location.hash = 'fynd'; else render(); }, 150); });
$('#price').addEventListener('input', e => { const v = e.target.value === '' ? null : Math.max(0, +e.target.value); S.price = isFinite(v) ? v : null; render(); });
$('#photoInput').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; onPhotosChosen(fs); });
$('#photoPick').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; onPhotosChosen(fs); });
$('#invImport').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!Array.isArray(d)) throw 0; S.inv = d; saveInv(); render(); toast(`Läste in ${d.length} saker.`); } catch { toast('Det där är ingen lagerkopia.'); }
});
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-cat],[data-open],[data-close],[data-buy],[data-delinv],[data-delterm],[data-photo],[data-retry],[data-premove],[data-dbsel],[data-dbform],[data-dbrun],[data-dbdel],[data-dbmore],#logout,#runScrape,#reload,#cfgReset,#invExport,#invImportBtn');
  if (!t) return;
  if (t.dataset.retry) {
    const f = S.fynd.find(x => x.id === t.dataset.retry); if (!f) return;
    const job = { id: f.id, createdAt: new Date().toISOString(), text: f.text || '', cat: '', image: f.photo };
    try {
      await putFile(`queue/${f.id}-r${Date.now().toString(36)}.json`, b64(JSON.stringify(job)), `Kör om foto ${f.id}`);
      S.pending.unshift({ id: f.id, createdAt: job.createdAt, text: f.text || (f.ai && f.ai.name) || 'Foto', thumb: rawUrl(f.photo) });
      store.set('tk-pending', S.pending); render(); schedulePoll(); toast('Körs om på GitHub.');
    } catch (err) { toast('Kunde inte köra om: ' + err.message); }
    return;
  }
  if (t.dataset.close && (e.target === t || t.tagName === 'BUTTON')) { S.open = null; renderSheet(); return; }
  if (t.dataset.cat) { S.cat = t.dataset.cat; store.set('tk-cat', S.cat); render(); return; }
  if (t.dataset.open) { S.open = t.dataset.open; renderSheet(); return; }
  if (t.dataset.photo === 'camera') { $('#photoInput').click(); return; }
  if (t.dataset.photo === 'pick') { $('#photoPick').click(); return; }
  if (t.dataset.photo === 'clear') { S.photos = []; render(); return; }
  if (t.dataset.premove != null) { S.photos.splice(+t.dataset.premove, 1); render(); return; }
  if (t.dataset.dbsel) { store.set('tk-dbsel', t.dataset.dbsel); S.dbLimit = 60; loadDb(t.dataset.dbsel); return; }
  if (t.dataset.dbform) { S.dbShowForm = !S.dbShowForm; render(); return; }
  if (t.dataset.dbmore) { S.dbLimit += 60; render(); return; }
  if (t.dataset.dbrun) { try { await dispatchDb(t.dataset.dbrun); toast('Djupscrapen har startat på GitHub. Den tar några minuter.'); } catch (err) { toast('Kunde inte starta: ' + err.message); } return; }
  if (t.dataset.dbdel) {
    const id = t.dataset.dbdel, k = 'w:' + id;
    if (S.confirm !== k) { S.confirm = k; render(); return; }
    S.confirm = null;
    try { await updateRepoJson('data/bevakningar.json', arr => arr.filter(x => x.id !== id), 'Ta bort bevakning ' + id); S.watches = S.watches.filter(x => x.id !== id); if (S.dbSel === id) { S.dbSel = S.watches[0] ? S.watches[0].id : null; S.db = null; if (S.dbSel) loadDb(S.dbSel); } render(); toast('Bevakningen är borttagen.'); }
    catch (err) { toast('Kunde inte ta bort: ' + err.message); }
    return;
  }
  if (t.id === 'logout') { tokenStore.set('', false); gh.token = ''; S.run = null; render(); toast('Utloggad från den här enheten.'); return; }
  if (t.dataset.buy != null) {
    const name = t.dataset.buy, price = t.dataset.buyprice ? S.fyndPrice[t.dataset.buyprice] : S.price;
    S.open = null; location.hash = 'lager'; S.tab = 'lager'; render();
    $('#invName').value = name; $('#invBuy').value = price ?? ''; $('#invBuy').focus(); return;
  }
  if (t.dataset.delinv) {
    const k = 'inv:' + t.dataset.delinv;
    if (S.confirm !== k) { S.confirm = k; render(); return; }
    S.confirm = null; S.inv = S.inv.filter(i => i.id !== t.dataset.delinv); saveInv(); render(); toast('Borttagen'); return;
  }
  if (t.dataset.delterm) {
    const id = t.dataset.delterm, k = 'term:' + id;
    if (S.confirm !== k) { S.confirm = k; render(); return; }
    S.confirm = null;
    try {
      await updateRepoJson('data/sokord.json', arr => arr.filter(x => slug(x.q) !== id), `Ta bort sökord ${id}`);
      S.terms.delete(id); render(); toast('Sökordet är borttaget. Det försvinner ur katalogen vid nästa scrape.');
    } catch (err) { toast('Kunde inte ta bort: ' + err.message); }
    return;
  }
  if (t.id === 'runScrape') { try { await dispatchScrape(); toast('Full scrape startad på GitHub. Den tar 6–10 minuter.'); } catch (err) { toast('Kunde inte starta: ' + err.message); } return; }
  if (t.id === 'reload') { await loadData(); toast('Datan är uppdaterad.'); return; }
  if (t.id === 'cfgReset') { S.cfg = { ...DEFAULT_CFG }; store.set('tk-settings', S.cfg); render(); toast('Reglerna är återställda'); return; }
  if (t.id === 'invExport') {
    const blob = new Blob([JSON.stringify(S.inv, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `thriftkollen-lager-${new Date().toISOString().slice(0, 10)}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000); return;
  }
  if (t.id === 'invImportBtn') { $('#invImport').click(); }
});
document.addEventListener('toggle', e => { if (e.target.dataset && e.target.dataset.dbfilters) S.dbFiltersOpen = e.target.open; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.open) { S.open = null; renderSheet(); } });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.dbf && el.tagName === 'SELECT') { S.dbFilter[el.dataset.dbf] = el.value; S.dbLimit = 60; render(); return; }

let sTimer;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'sheetPrice') { S.price = el.value === '' ? null : +el.value; $('#price').value = el.value; clearTimeout(sTimer); sTimer = setTimeout(() => { render(); const sp = $('#sheetPrice'); if (sp) sp.focus(); }, 300); }
  if (el.dataset.dbf && el.tagName === 'INPUT') { const k = el.dataset.dbf; S.dbFilter[k] = el.value; clearTimeout(sTimer); sTimer = setTimeout(() => { S.dbLimit = 60; render(); }, 450); }
  if (el.dataset.ptext != null) { const p = S.photos[+el.dataset.ptext]; if (p) p.text = el.value; }
  if (el.dataset.fprice) { const id = el.dataset.fprice; S.fyndPrice[id] = el.value === '' ? null : +el.value; clearTimeout(sTimer); sTimer = setTimeout(() => { render(); const f = document.getElementById('fp-' + id); if (f) { f.focus(); } }, 400); }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'photoForm') { sendPhotos(); return; }
  if (f.id === 'invForm') {
    const name = $('#invName').value.trim(), buy = +$('#invBuy').value;
    if (!name || !isFinite(buy)) return;
    const term = [...S.terms.values()].find(t => norm(t.q) === norm(name)) || [...S.terms.values()].map(t => [t, matches(t, name)]).filter(([, s]) => s > 0).sort((a, b) => b[1] - a[1]).map(([t]) => t)[0];
    S.inv.push({ id: Date.now().toString(36), name, buy, boughtAt: $('#invDate').value || new Date().toISOString().slice(0, 10), status: 'stock', platform: '', termId: term ? term.id : null, soldPrice: null, soldAt: null });
    saveInv(); render(); toast('Lagt i lagret'); return;
  }
  if (f.id === 'cfgForm') {
    const num = (id, d) => { const v = +$('#c-' + id).value; return isFinite(v) ? v : d; };
    S.cfg = { ...S.cfg, minProfit: num('minProfit', 100), minMult: Math.max(1, num('minMult', 2)), mode: $('#c-mode').value, valuation: $('#c-valuation').value, platform: $('#c-platform').value,
      haggle: num('haggle', 20), traderaPct: num('traderaPct', 10), traderaCap: num('traderaCap', 200), blocketFee: num('blocketFee', 0) };
    store.set('tk-settings', S.cfg); render(); toast('Reglerna är sparade'); return;
  }
  if (f.id === 'ghForm') {
    gh.owner = $('#g-owner').value.trim(); gh.repo = $('#g-repo').value.trim();
    const newToken = $('#g-token').value.trim(); if (newToken) { gh.token = newToken; tokenStore.set(newToken, true); }
    store.set('tk-github', { owner: gh.owner, repo: gh.repo });
    const st = $('#ghStatus'); st.textContent = 'Testar…';
    try {
      const r = await api(repoPath(''));
      const ok = r.permissions && r.permissions.push;
      st.textContent = ok ? 'Ansluten. Nyckeln kan skicka foton.' : 'Ansluten, men nyckeln saknar skrivrätt.';
      render(); $('#ghStatus').textContent = st.textContent; loadData(true);
    } catch (err) { st.textContent = err.status === 401 ? 'Nyckeln godtogs inte.' : err.status === 404 ? 'Hittar inte repot (eller nyckeln har inte tillgång till det).' : 'Fel: ' + err.message; }
    return;
  }
  if (f.id === 'loginForm') {
    const st = $('#loginStatus'), pw = $('#loginPw').value, remember = $('#remember').checked;
    if (!S.auth) { st.textContent = 'Ingen nyckel är sparad på kontot.'; return; }
    st.textContent = 'Låser upp…';
    let token;
    try { token = await openToken(S.auth, pw); } catch { st.textContent = 'Fel lösenord.'; $('#loginPw').select(); return; }
    gh.token = token; tokenStore.set(token, remember); S.borrowed = !remember;
    try { await api(repoPath('')); } catch (err) { st.textContent = err.status === 401 ? 'Lösenordet stämmer, men nyckeln har slutat gälla. Skapa en ny under Avancerat.' : 'Fel: ' + err.message; gh.token = ''; tokenStore.set('', false); return; }
    render(); toast(remember ? 'Inloggad.' : 'Inloggad tills fliken stängs.'); loadData(true); return;
  }
  if (f.id === 'sealForm') {
    const p1 = $('#pw1').value, p2 = $('#pw2').value;
    if (p1.length < 10) { toast('Lösenordet behöver minst 10 tecken.'); return; }
    if (p1 !== p2) { toast('Lösenorden är inte lika.'); return; }
    try {
      const blob = await sealToken(gh.token, p1);
      if (await openToken(blob, p1) !== gh.token) throw new Error('Kontrollen misslyckades.');
      let sha; try { sha = (await api(repoPath('/contents/' + AUTH_PATH + '?ref=' + gh.branch))).sha; } catch {}
      await putFile(AUTH_PATH, b64(JSON.stringify(blob, null, 1)), 'Spara krypterad nyckel på kontot', sha);
      S.auth = blob; render(); toast('Nyckeln är sparad på kontot. Logga in med lösenordet på andra enheter.');
    } catch (err) { toast('Kunde inte spara: ' + err.message); }
    return;
  }
  if (f.id === 'watchForm') {
    const [param, value, catName] = ($('#w-cat').value || '||').split('|'); const [loc, locName] = ($('#w-reg').value || '|').split('|');
    const q = $('#w-q').value.trim();
    if (!value && !q) { toast('Välj en kategori eller skriv ett sökord.'); return; }
    const name = $('#w-name').value.trim() || [catName ? catName.split(' › ').pop() : '', q ? '”' + q + '”' : '', locName || 'Hela Sverige'].filter(Boolean).join(' · ');
    const id = slug(name).slice(0, 60) + '-' + Date.now().toString(36).slice(-4);
    const w = { id, name, category: value || '', categoryParam: param || 'category', categoryName: catName || '', location: loc || '', locationName: locName || '', q,
      priceFrom: +$('#w-min').value || null, priceTo: +$('#w-max').value || null, maxListings: Math.min(40000, Math.max(100, +$('#w-cap').value || 15000)),
      conditions: $('#w-cond').checked, enabled: true, createdAt: new Date().toISOString() };
    try {
      await updateRepoJson('data/bevakningar.json', arr => (arr || []).concat([w]), 'Ny bevakning: ' + name);
      S.watches = (S.watches || []).concat([w]); S.dbShowForm = false; S.dbSel = id; S.db = null; store.set('tk-dbsel', id);
      await dispatchDb(id).catch(() => {});
      render(); toast('Bevakningen är skapad och första körningen har startat.');
    } catch (err) { toast('Kunde inte spara: ' + err.message); }
    return;
  }
  if (f.id === 'termForm') {
    const q = $('#t-q').value.trim(); if (!q) return;
    const id = slug(q); if (!id) return;
    if (S.terms.has(id)) { toast('Det sökordet finns redan.'); return; }
    try {
      await updateRepoJson('data/sokord.json', arr => arr.concat([{ q, cat: $('#t-cat').value, ...($('#t-must').value.trim() ? { must: $('#t-must').value.trim() } : {}) }]), `Nytt sökord: ${q}`);
      await dispatchScrape().catch(() => {});
      toast('Sökordet är sparat. En scrape har startat.');
      f.reset();
    } catch (err) { toast('Kunde inte spara: ' + err.message); }
  }
});
function route() { const h = location.hash.replace('#', ''); S.tab = TABS.includes(h) ? h : 'fynd'; S.confirm = null; render(); }
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.state !== 'loading') loadData(true); });

$('#menuToggle').addEventListener('click', () => { setMenu(!S.menuOpen); if (S.menuOpen) setTimeout(() => $('#q').focus({ preventScroll: true }), 50); });
$('#barInfo').addEventListener('click', () => setMenu(!S.menuOpen));
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.target.blur(); setMenu(false); } });
setMenu(store.get('tk-menu', false));
route();
loadData(true).then(schedulePoll);
loadAuth();
})();
</script>
</body>
</html>
